<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>土豆兄弟 Mini</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #06080c;
    color: #e6edf6;
    font-family: "Microsoft YaHei", system-ui, -apple-system, "PingFang SC", sans-serif;
    overflow: hidden;
    display: grid;
    place-items: center;
    user-select: none;
  }
  #stage {
    position: relative;
    width: min(96vw, 160vh);
    aspect-ratio: 960 / 600;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 0 0 1px rgba(120,190,255,.16), 0 24px 80px rgba(0,0,0,.75), 0 0 120px rgba(60,120,220,.10);
    background: #0b0e15;
    container-type: size;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; width: 100%; height: 100%; }
  #vignette {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.55) 100%);
  }

  /* ---------- HUD ---------- */
  #hud { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .3s; }
  #hud.show { opacity: 1; }
  .row { position: absolute; left: 3.2cqw; right: 3.2cqw; display: flex; align-items: center; gap: 1.4cqw; }
  .row.top { top: 2.6cqh; }
  .row.bottom { bottom: 2.4cqh; }

  .hpwrap { flex: 0 0 auto; display: flex; align-items: center; gap: .9cqw; }
  .hpbar {
    width: 24cqw; height: 1.9cqh; min-height: 12px;
    background: rgba(255,255,255,.09);
    border-radius: 999px; overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.10);
  }
  .hpbar i {
    display: block; height: 100%; width: 100%;
    background: linear-gradient(90deg, #ff5a6e, #ff8f6b);
    box-shadow: 0 0 14px rgba(255,90,110,.55);
    transition: width .12s linear;
    border-radius: 999px;
  }
  #hptext { font-size: 1.45cqw; font-variant-numeric: tabular-nums; color: #ffb4bd; min-width: 8cqw; }

  .stats { margin-left: auto; display: flex; gap: 1.5cqw; align-items: center; font-size: 1.5cqw; color: #93a4bd; }
  .stats b { color: #e6edf6; font-variant-numeric: tabular-nums; }
  #waveLabel { color: #7ee0b8; font-weight: 700; }
  #timeLabel { color: #ffd479; font-variant-numeric: tabular-nums; min-width: 4.6cqw; text-align: right; }
  #mute {
    pointer-events: auto; cursor: pointer;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
    color: #cfe0f5; border-radius: 8px; padding: .3cqw .8cqw; font-size: 1.3cqw;
  }
  #mute:hover { background: rgba(255,255,255,.12); }

  .lv { font-size: 1.5cqw; color: #93a4bd; flex: 0 0 auto; }
  .lv b { color: #ffd479; font-size: 1.8cqw; }
  .lv #lvPend { color: #ffd479; font-size: 1.25cqw; font-weight: 800; }
  #matLabel { color: #7ee0b8; }
  .xpbar {
    flex: 1; height: 1.2cqh; min-height: 8px;
    background: rgba(255,255,255,.08);
    border-radius: 999px; overflow: hidden;
  }
  .xpbar i {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, #46d6a0, #6ee7ff);
    box-shadow: 0 0 12px rgba(90,230,190,.5);
    transition: width .15s linear;
    border-radius: 999px;
  }

  /* ---------- 武器槽 ---------- */
  #weapons {
    position: absolute; left: 3.2cqw; bottom: 6.6cqh;
    display: flex; gap: .6cqw; pointer-events: none; flex-wrap: wrap; max-width: 84cqw;
  }
  .wchip {
    position: relative; overflow: hidden;
    display: flex; align-items: center; gap: .4cqw;
    padding: .45cqh .7cqw .6cqh; border-radius: 9px;
    background: rgba(255,255,255,.055);
    border: 1px solid rgba(255,255,255,.12);
    font-size: 1.2cqw; color: #e6edf6;
  }
  .wchip.on2 { border-color: #5aa9ff; background: rgba(90,169,255,.14); box-shadow: 0 0 10px rgba(90,169,255,.2); }
  .wchip.on3 { border-color: #b06bff; background: rgba(176,107,255,.16); box-shadow: 0 0 11px rgba(176,107,255,.24); }
  .wchip.on4 { border-color: #ff5d5d; background: rgba(255,93,93,.18); box-shadow: 0 0 12px rgba(255,93,93,.28); }
  .wchip em { font-style: normal; font-size: 1.5cqw; }
  .wchip b { color: #ffd479; font-size: 1.1cqw; }
  .wchip i { font-style: normal; color: #7ee0b8; font-size: 1.05cqw; }
  .wchip u {
    position: absolute; left: 0; bottom: 0; height: 2px; width: 100%;
    background: linear-gradient(90deg, #4fd39a, #8be9fd);
    box-shadow: 0 0 8px rgba(90,230,190,.7);
    display: block; text-decoration: none;
  }

  /* ---------- 覆盖层 ---------- */
  #overlay {
    position: absolute; inset: 0; z-index: 5;
    display: none; place-items: center;
    background: rgba(5,8,13,.78);
    backdrop-filter: blur(4px);
  }
  #overlay.show { display: grid; }
  .panel { text-align: center; padding: 1.6cqw 3cqw; max-width: 94%; animation: pop .22s ease-out; }
  @keyframes pop { from { transform: scale(.94); opacity: 0 } to { transform: scale(1); opacity: 1 } }

  .title {
    font-size: 5.2cqw; font-weight: 900; letter-spacing: .2cqw;
    background: linear-gradient(180deg, #ffe9a8, #ffb44d 55%, #f2803a);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 6px 24px rgba(255,150,60,.35));
    line-height: 1.15;
  }
  .subtitle { margin-top: 1cqh; font-size: 1.55cqw; color: #8ea3bf; line-height: 1.9; }
  .subtitle kbd {
    display: inline-block; padding: .1cqw .7cqw; margin: 0 .2cqw;
    background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.16);
    border-radius: 5px; font-family: inherit; font-size: 1.35cqw; color: #dbe7f7;
  }
  .btn {
    margin-top: 3cqh; cursor: pointer;
    font-family: inherit; font-size: 2cqw; font-weight: 800; letter-spacing: .1cqw;
    color: #08131a; padding: 1.2cqh 4.2cqw; border: 0; border-radius: 12px;
    background: linear-gradient(180deg, #9df0c8, #4fd39a);
    box-shadow: 0 6px 0 #218b63, 0 12px 30px rgba(60,220,160,.28);
    transition: transform .08s, box-shadow .08s;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #218b63; }

  .cards { display: flex; gap: 1.4cqw; margin-top: 2.2cqh; justify-content: center; flex-wrap: wrap; width: 100%; }
  .card {
    cursor: pointer; width: 18cqw; min-width: 150px; position: relative;
    padding: 1.6cqh 1.4cqw; border-radius: 14px; text-align: left;
    background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03));
    border: 1px solid rgba(255,255,255,.10);
    border-top: 3px solid var(--c, #7ee0b8);
    transition: transform .12s, background .12s, box-shadow .12s, opacity .12s;
  }
  .card:hover {
    transform: translateY(-5px);
    background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.05));
    box-shadow: 0 14px 34px rgba(0,0,0,.5), 0 0 0 1px var(--c, #7ee0b8) inset;
  }
  .card .ico { font-size: 2.6cqw; line-height: 1; }
  .card .nm { margin-top: .8cqh; font-size: 1.7cqw; font-weight: 800; color: var(--c, #7ee0b8); }
  .card .ds { margin-top: .5cqh; font-size: 1.3cqw; color: #a9bdd6; line-height: 1.5; }
  .card .st { margin-top: .8cqh; font-size: 1.15cqw; color: #6b7f99; }
  .card .rar-tag {
    position: absolute; top: .7cqh; right: .7cqw;
    font-size: .95cqw; font-weight: 800; letter-spacing: .05cqw;
    color: var(--c, #7ee0b8); opacity: .95;
  }
  .card.rar4 { box-shadow: 0 8px 30px rgba(255,93,93,.14); }

  /* 商店 */
  .cards.shop .card { width: 20cqw; min-width: 170px; }
  /* 升级 / 开箱：一屏 4 张 */
  .cards.lv { min-width: 70cqw; }
  .cards.lv .card { width: 15.6cqw; min-width: 126px; }
  .card .price { margin-top: 1cqh; font-size: 1.55cqw; font-weight: 800; color: #ffd479; }
  .card.locked { opacity: .4; cursor: not-allowed; }
  .card.locked:hover { transform: none; box-shadow: none; background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03)); }
  .card.sold { opacity: .28; cursor: default; }
  .card.sold:hover { transform: none; box-shadow: none; }
  /* 买过的商品：位置保留但完全空置 */
  .card.blank {
    min-height: 25cqh;
    background: rgba(255,255,255,.022); border: 1px dashed rgba(255,255,255,.16);
    box-shadow: none; pointer-events: none; opacity: 1;
  }
  .card.blank:hover { transform: none; box-shadow: none; border-color: rgba(255,255,255,.07); }
  /* 开箱：只有一张卡，居中且不撑满 */
  .cards.lv.one { min-width: 0; }
  .cards.lv.one .card { width: 19cqw; min-width: 200px; max-width: 300px; }
  .shop-head { font-size: 3.4cqw; font-weight: 900; color: #ffe9a8; letter-spacing: .2cqw; }
  .shop-head span { color: #ffd479; font-size: 2.4cqw; margin-left: 1cqw; }
  .shop-sub { margin-top: .8cqh; font-size: 1.45cqw; color: #8ea3bf; }
  .btnrow { display: flex; justify-content: center; align-items: center; gap: 1.2cqw; margin-top: 2.6cqh; }
  .btnrow .btn { margin-top: 0; }
  .btn.ghost {
    background: transparent; color: #cfe0f5;
    border: 1px solid rgba(255,255,255,.22); box-shadow: none;
    font-size: 1.55cqw; padding: 1cqh 2.6cqw;
  }
  .btn.ghost:hover { background: rgba(255,255,255,.08); transform: none; }
  .btn.ghost:disabled { opacity: .3; cursor: not-allowed; }
  .btn.ghost:active { box-shadow: none; transform: none; }

  .over-title { font-size: 3.6cqw; font-weight: 900; color: #ff7a86; letter-spacing: .1cqw; }
  .results { margin-top: 2.4cqh; display: flex; gap: 3cqw; justify-content: center; }
  .results div { text-align: center; }
  .results span { display: block; font-size: 1.35cqw; color: #8397b1; }
  .results strong { display: block; font-size: 3cqw; color: #ffd479; font-variant-numeric: tabular-nums; }
  .tip { margin-top: 2.2cqh; font-size: 1.3cqw; color: #6b7f99; }

  /* ---------- 右侧角色面板（暂停 / 商店） ---------- */
  #side {
    position: absolute; top: 0; right: 0; bottom: 0; width: 27.5cqw;
    z-index: 6; display: none; flex-direction: column;
    padding: 1.5cqh 1.1cqw 1.2cqh;
    background: linear-gradient(180deg, rgba(11,17,26,.975), rgba(7,11,17,.99));
    border-left: 1px solid rgba(120,190,255,.18);
    box-shadow: -16px 0 44px rgba(0,0,0,.55);
    overflow: hidden;
  }
  #side.show { display: flex; }
  .sp-title {
    display: flex; justify-content: space-between; align-items: baseline;
    padding-bottom: .7cqh; border-bottom: 1px solid rgba(255,255,255,.09);
    font-size: 1.45cqw; font-weight: 900; color: #ffe9a8; letter-spacing: .1cqw;
  }
  .sp-title span { font-size: 1.1cqw; font-weight: 700; color: #ffd479; letter-spacing: 0; }
  /* 属性栏：两列，可上下滚动 */
  .sp-statwrap {
    max-height: 34cqh; overflow-y: auto; overflow-x: hidden;
    margin-top: .7cqh; padding-right: .25cqw;
  }
  .sp-statwrap::-webkit-scrollbar { width: 4px; }
  .sp-statwrap::-webkit-scrollbar-thumb { background: rgba(255,255,255,.22); border-radius: 4px; }
  .sp-statwrap::-webkit-scrollbar-track { background: transparent; }
  .sp-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: .38cqh .9cqw; }
  .sp-row { display: flex; justify-content: space-between; gap: .3cqw; font-size: 1.02cqw; color: #8ea4bf; white-space: nowrap; }
  .sp-row b { color: #dbe7f7; font-weight: 800; font-variant-numeric: tabular-nums; }
  .sp-row.hi b { color: #7ee0b8; }
  .sp-row.full { grid-column: 1 / -1; font-size: 1.1cqw; }
  .sp-row.full b { color: #ffd479; }
  .sp-head {
    margin-top: .9cqh; display: flex; justify-content: space-between; align-items: baseline;
    font-size: 1.1cqw; font-weight: 800; color: #9db4d0; letter-spacing: .08cqw;
  }
  .sp-head b { font-size: .95cqw; font-weight: 700; color: #ffd479; letter-spacing: 0; }
  .sp-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: .34cqw; margin-top: .5cqh; }
  .sp-grid.gear { grid-template-columns: repeat(5, 1fr); }
  .slot {
    position: relative; aspect-ratio: 1; border-radius: 6px;
    display: grid; place-items: center; font-size: 1.1cqw; line-height: 1;
    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.10);
    transition: transform .1s, box-shadow .1s;
  }
  .slot.empty { background: rgba(255,255,255,.015); border-style: dashed; border-color: rgba(255,255,255,.07); }
  .slot em { font-style: normal; filter: saturate(.95); }
  .slot u {
    position: absolute; right: 1px; bottom: 0; text-decoration: none;
    font-size: .8cqw; font-weight: 800; color: #ffe9a8; text-shadow: 0 0 4px #000;
  }
  .slot.on2 { border-color: #5aa9ff; box-shadow: inset 0 0 0 1px rgba(90,169,255,.4), 0 0 10px rgba(90,169,255,.25); }
  .slot.on3 { border-color: #b06bff; box-shadow: inset 0 0 0 1px rgba(176,107,255,.45), 0 0 12px rgba(176,107,255,.3); }
  .slot.on4 { border-color: #ff5d5d; box-shadow: inset 0 0 0 1px rgba(255,93,93,.5), 0 0 14px rgba(255,93,93,.35); }
  .slot.hoverable:hover { transform: translateY(-1px); box-shadow: 0 0 0 1px rgba(255,255,255,.35); }
  .slot.sellable { cursor: pointer; }
  .slot.sellable:hover { box-shadow: 0 0 0 1px rgba(255,212,121,.65), 0 0 12px rgba(255,180,60,.25); }
  .slot.sel { box-shadow: 0 0 0 2px #ffd479, 0 0 14px rgba(255,180,60,.35) !important; }
  .slot .cnt {
    position: absolute; right: 1px; bottom: 0;
    font-size: .8cqw; font-weight: 800; color: #ffe9a8; text-shadow: 0 0 4px #000;
  }

  /* 道具栏：不限制种类数量，超出可滚动 */
  .sp-gearwrap { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; margin-top: .35cqh; padding-right: .15cqw; }
  .sp-gearwrap::-webkit-scrollbar { width: 4px; }
  .sp-gearwrap::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 4px; }

  /* 出售 / 合成弹窗 */
  #sellPop {
    position: absolute; z-index: 11; display: none; width: 14cqw; min-width: 148px;
    padding: .75cqh .7cqw; border-radius: 10px; text-align: left;
    background: rgba(7,11,17,.985);
    border: 1px solid rgba(255,212,121,.42);
    box-shadow: 0 16px 44px rgba(0,0,0,.72);
    font-size: 1cqw; color: #a9bdd6;
  }
  #sellPop.on { display: block; animation: pop .14s ease-out; }
  #sellPop .pop-t { font-size: 1.05cqw; font-weight: 800; color: #e6edf6; }
  #sellPop .pop-s { margin-top: .2cqh; font-size: .9cqw; color: #6b7f99; }
  #sellPop .pop-row { display: flex; gap: .3cqw; margin-top: .55cqh; }
  #sellPop .pop-b {
    flex: 1; cursor: pointer; font-family: inherit; font-size: .92cqw; font-weight: 800;
    padding: .45cqh .2cqw; border-radius: 7px; border: 1px solid rgba(255,212,121,.35);
    background: rgba(255,212,121,.14); color: #ffd479;
  }
  #sellPop .pop-b:hover { background: rgba(255,212,121,.26); }
  #sellPop .pop-b.merge { border-color: rgba(126,224,184,.4); background: rgba(126,224,184,.14); color: #7ee0b8; }
  #sellPop .pop-b.merge:hover { background: rgba(126,224,184,.26); }
  #sellPop .pop-b:disabled { opacity: .35; cursor: not-allowed; }

  #wtt {
    position: absolute; z-index: 9; width: 18cqw; min-width: 188px;
    padding: .8cqh .75cqw; border-radius: 9px; text-align: left;
    background: rgba(6,10,16,.975);
    border: 1px solid rgba(140,200,255,.32);
    box-shadow: 0 12px 34px rgba(0,0,0,.65);
    font-size: 1cqw; color: #a9bdd6; line-height: 1.55;
    display: none; pointer-events: none;
  }
  #wtt.on { display: block; }
  #wtt .tt-h { font-size: 1.2cqw; font-weight: 900; margin-bottom: .2cqh; }
  #wtt .tt-s { font-size: .92cqw; color: #6b7f99; margin-bottom: .45cqh; }
  #wtt .tt-l { display: flex; justify-content: space-between; gap: .5cqw; white-space: nowrap; }
  #wtt .tt-l b { color: #dbe7f7; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; overflow: hidden; text-overflow: ellipsis; }
  #wtt .tt-x { margin-top: .4cqh; color: #c39bff; }

  /* 商店/暂停时给右侧面板让位 */
  /* 用百分比而不是 cqw：cqw 在弹层里解析基准与侧栏不同，会导致留白对不齐 */
  #overlay.with-side { padding-right: 27.5%; }
  #overlay.with-side .panel { width: 100%; max-width: 100%; padding-left: 1.4cqw; padding-right: 1.4cqw; }
  #overlay.with-side .cards.shop { gap: 1cqw; flex-wrap: nowrap; }
  #overlay.with-side .cards.shop .card { width: auto; flex: 1 1 0; min-width: 0; padding: 1.3cqh 1cqw; }
  #overlay.with-side .card .nm { font-size: 1.45cqw; }
  #overlay.with-side .card .ds { font-size: 1.12cqw; }
  #overlay.with-side .card .st { font-size: 1cqw; }
  #overlay.with-side .card .rar-tag { font-size: .85cqw; top: .5cqh; right: .55cqw; }
  #overlay.with-side .card .price { font-size: 1.35cqw; }
  #overlay.with-side .card .ico { font-size: 2.2cqw; }
  #overlay.with-side .shop-head { font-size: 2.9cqw; }
  #overlay.with-side .shop-sub { font-size: 1.25cqw; }

  /* 暂停面板 */
  .pause-t { font-size: 3.6cqw; font-weight: 900; color: #ffe9a8; letter-spacing: .3cqw; }

  /* ---------- 触屏 ---------- */
  #pauseBtn { display: none; }

  #stick {
    position: absolute; z-index: 4; pointer-events: none;
    border-radius: 50%; opacity: 0;
    transform: translate(-50%, -50%);
    border: 2px solid rgba(140,220,255,.38);
    background: radial-gradient(circle, rgba(90,200,255,.12), rgba(90,200,255,.02));
    transition: opacity .12s;
  }
  #stick.on { opacity: 1; }
  #knob {
    position: absolute; left: 50%; top: 50%;
    width: 46%; height: 46%; border-radius: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle at 34% 30%, #d9f2ff, #4aa8e0 70%, #2a6fa0);
    box-shadow: 0 0 20px rgba(90,200,255,.6);
  }

  #rotate {
    display: none; position: fixed; inset: 0; z-index: 99;
    place-items: center; text-align: center; padding: 8vw;
    background: #06080c;
  }
  #rotate > div { width: 100%; text-align: center; }
  #rotate .rt-ico { font-size: 18vw; line-height: 1; animation: turn 2s ease-in-out infinite; }
  @keyframes turn {
    0%, 40% { transform: rotate(0) } 60%, 100% { transform: rotate(-90deg) }
  }
  #rotate .rt-t { margin-top: 5vh; font-size: 6vw; font-weight: 800; color: #ffe9a8; }
  #rotate .rt-s { margin-top: 2vh; font-size: 3.6vw; color: #7f93ad; line-height: 1.9; }

  @media (pointer: coarse) {
    html, body { display: block; }
    #stage {
      width: 100vw; height: 100vh; height: 100dvh;
      aspect-ratio: auto; border-radius: 0; box-shadow: none;
    }
    #pauseBtn { display: inline-block; }
    #mute, #pauseBtn { padding: .5cqw 1.2cqw; font-size: 1.7cqw; }
    #weapons { top: 14.4cqh; bottom: auto; left: calc(3.2cqw + env(safe-area-inset-left)); }
    .wchip { font-size: 1.6cqw; padding: .6cqh .9cqw .8cqh; gap: .5cqw; }
    .wchip span { display: none; }
    .wchip em { font-size: 2cqw; }
    .row { left: calc(3.2cqw + env(safe-area-inset-left)); right: calc(3.2cqw + env(safe-area-inset-right)); }
    .row.top { top: calc(2.6cqh + env(safe-area-inset-top)); }
    .row.bottom { bottom: calc(2.4cqh + env(safe-area-inset-bottom)); }
    .hpbar { width: 30cqw; }
    .stats { gap: 2cqw; font-size: 1.7cqw; }
    #hptext { font-size: 1.6cqw; }

<script>
(() => {
'use strict';

/* =========================================================
   基础
   ========================================================= */
const BASE_W = 960;
let W = BASE_W, H = 600;
const TAU = Math.PI * 2;

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const panel = document.getElementById('panel');
const hud = document.getElementById('hud');
const muteBtn = document.getElementById('mute');
const pauseBtn = document.getElementById('pauseBtn');
const weaponBar = document.getElementById('weapons');

const stageEl = document.getElementById('stage');
const stickEl = document.getElementById('stick');
const knobEl = document.getElementById('knob');
const IS_TOUCH = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || 'ontouchstart' in window;

const el = {
  hpfill: document.getElementById('hpfill'),
  hptext: document.getElementById('hptext'),
  wave: document.getElementById('waveLabel'),
  time: document.getElementById('timeLabel'),
  kill: document.getElementById('killLabel'),
  lv: document.getElementById('lvNum'),
  xp: document.getElementById('xpfill'),
  mat: document.getElementById('matLabel'),
  lvPend: document.getElementById('lvPend'),
};

function fitCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, IS_TOUCH ? 1.75 : 2);
  const cw = stageEl.clientWidth || BASE_W;
  const ch = stageEl.clientHeight || 600;
  const scale = cw / BASE_W;
  W = BASE_W;
  H = Math.max(360, Math.min(1100, Math.round(ch / scale)));
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = true;
}
fitCanvas();
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 120));

const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };

/* =========================================================
   音效
   ========================================================= */
let AC = null, muted = false;
muteBtn.addEventListener('click', () => {
  muted = !muted;
  muteBtn.textContent = muted ? '🔇' : '🔊';
});

function sfx(kind) {
  if (muted) return;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { return; }

  const t = AC.currentTime;
  const o = AC.createOscillator();
  const g = AC.createGain();
  o.connect(g); g.connect(AC.destination);

  let f0 = 440, f1 = 440, dur = 0.08, vol = 0.03, type = 'square';
  switch (kind) {
    case 'shoot':  f0 = 620; f1 = 320; dur = 0.055; vol = 0.02;  type = 'square'; break;
    case 'shotgun':f0 = 300; f1 = 110; dur = 0.13;  vol = 0.035; type = 'square'; break;
    case 'rail':   f0 = 1200;f1 = 420; dur = 0.14;  vol = 0.028; type = 'sine'; break;
    case 'hit':    f0 = 240; f1 = 160; dur = 0.045; vol = 0.022; type = 'triangle'; break;
    case 'swing':  f0 = 420; f1 = 130; dur = 0.09;  vol = 0.028; type = 'triangle'; break;
    case 'sell':   f0 = 760; f1 = 420; dur = 0.10;  vol = 0.03;  type = 'triangle'; break;
    case 'kill':   f0 = 170; f1 = 70;  dur = 0.13;  vol = 0.032; type = 'sawtooth'; break;
    case 'hurt':   f0 = 140; f1 = 60;  dur = 0.20;  vol = 0.055; type = 'sawtooth'; break;
    case 'gem':    f0 = 880; f1 = 1180; dur = 0.05; vol = 0.014; type = 'sine'; break;
    case 'coin':   f0 = 1046;f1 = 1568; dur = 0.07; vol = 0.018; type = 'triangle'; break;
    case 'buy':    f0 = 660; f1 = 990; dur = 0.12;  vol = 0.045; type = 'sine'; break;
    case 'level':  f0 = 520; f1 = 1040; dur = 0.30; vol = 0.05;  type = 'sine'; break;
    case 'wave':   f0 = 300; f1 = 620; dur = 0.35;  vol = 0.04;  type = 'sine'; break;
    case 'boss':   f0 = 90;  f1 = 50;  dur = 0.7;   vol = 0.07;  type = 'sawtooth'; break;
    case 'roar':   f0 = 180; f1 = 60;  dur = 0.5;   vol = 0.06;  type = 'square'; break;
  }
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.start(t); o.stop(t + dur + 0.02);
}

/* =========================================================
   输入
   ========================================================= */
const keys = new Set();
const BLOCK = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space']);
window.addEventListener('keydown', e => {
  if (BLOCK.has(e.code)) e.preventDefault();
  keys.add(e.code);
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  if (e.code === 'KeyM') { muted = !muted; muteBtn.textContent = muted ? '🔇' : '🔊'; }
  if (e.code === 'KeyR' && (G.state === 'dead' || G.state === 'paused')) startGame();
});
window.addEventListener('keyup', e => keys.delete(e.code));
window.addEventListener('blur', () => { keys.clear(); if (G.state === 'playing') showPause(); });

/* ---------- 触屏虚拟摇杆 ---------- */
const touchVec = { x: 0, y: 0 };
let stickId = null;
const stickBase = { x: 0, y: 0 };
let stickR = 60;

function stickShow(cx, cy) {
  const rect = stageEl.getBoundingClientRect();
  stickR = Math.max(42, Math.min(rect.width, rect.height) * 0.17);
  stickBase.x = cx; stickBase.y = cy;
  stickEl.style.left = cx + 'px';
  stickEl.style.top = cy + 'px';
  stickEl.style.width = stickEl.style.height = (stickR * 2) + 'px';
  stickEl.classList.add('on');
  stickKnob(0, 0);
}
function stickKnob(dx, dy) {
  knobEl.style.transform = `translate(calc(-50% + ${dx.toFixed(1)}px), calc(-50% + ${dy.toFixed(1)}px))`;
}
function stickReset() {
  stickId = null;
  touchVec.x = 0; touchVec.y = 0;
  stickEl.classList.remove('on');
}

stageEl.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse') return;
  if (G.state === 'paused') { togglePause(); return; }
  if (G.state !== 'playing' || stickId !== null) return;
  const rect = stageEl.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  if (x > rect.width * 0.56) return;
  stickId = e.pointerId;
  stickShow(x, y);
  e.preventDefault();
}, { passive: false });

window.addEventListener('pointermove', e => {
  if (e.pointerId !== stickId) return;
  const rect = stageEl.getBoundingClientRect();
  let dx = e.clientX - rect.left - stickBase.x;
  let dy = e.clientY - rect.top - stickBase.y;
  const lim = stickR * 0.84;
  const d = Math.hypot(dx, dy);
  if (d > lim) { dx = dx / d * lim; dy = dy / d * lim; }
  stickKnob(dx, dy);
  const nx = dx / lim, ny = dy / lim;
  const n = Math.hypot(nx, ny);
  const dead = 0.14;
  if (n < dead) { touchVec.x = 0; touchVec.y = 0; }
  else {
    const k = Math.min(1, (n - dead) / (1 - dead)) / n;
    touchVec.x = nx * k; touchVec.y = ny * k;
  }
  e.preventDefault();
}, { passive: false });

window.addEventListener('pointerup', e => { if (e.pointerId === stickId) stickReset(); });
window.addEventListener('pointercancel', e => { if (e.pointerId === stickId) stickReset(); });
window.addEventListener('blur', stickReset);
pauseBtn.addEventListener('click', () => togglePause());
// 暂停时点空白处继续（触屏主要靠这个）
overlay.addEventListener('click', e => {

}, 140));

/* =========================================================

   ========================================================= */
const RARITY = {

};

function rarColor(r) { return (RARITY[r] || RARITY[1]).color; }

/* =========================================================

   ========================================================= */
const DMG_TYPES = {
  melee:  { name: '近战', color: '#ff9a6b' },
  ranged: { name: '远程', color: '#8be9fd' },
  elem:   { name: '元素', color: '#c39bff' },
  pct:    { name: '百分比', color: '#ff6b9d' },
};
// mix 里各类型的权重（不必相加为 1，计算时按比例归一）
function mixTotal(mix) {
  let t = 0;
  for (const k in mix) t += mix[k];
  return t || 1;
}
// 「对应伤害倍率 × 对应伤害」：把玩家的该类型伤害值按武器构成比例加权
function mixAdd(p, mix) {
  const t = mixTotal(mix);
  let a = 0;
  for (const k in mix) a += (mix[k] / t) * (p.typeDmg[k] || 0);
  return a;
}
// 护甲：递减的百分比减伤（1 点≈6%，10 点=40%），永远趋近但不超过 99%
const ARMOR_CAP = 0.99;
function armorDR(armor) {
  if (armor <= 0) return 0;
  return Math.min(ARMOR_CAP, armor / (armor + 15));
}

/* 生命再生：不再连续回血，而是「每滴血」跳一次
   每秒回复 regen 滴 → 间隔 = 1/regen 秒，最短 0.01 秒（每秒最多 100 滴） */
const REGEN_MIN_INTERVAL = 0.01;
function regenInterval(regen) {
  if (regen <= 0) return Infinity;
  return Math.max(REGEN_MIN_INTERVAL, 1 / regen);
}
// 受间隔下限约束后的真实每秒回血量
function regenRate(regen) {
  const iv = regenInterval(regen);
  return iv === Infinity ? 0 : 1 / iv;
}
function mixText(mix) {
  const out = [];
  for (const k in mix) {
    if (mix[k] <= 0.001) continue;
    out.push(`${DMG_TYPES[k].name} ${Math.round(mix[k] / mixTotal(mix) * 100)}%`);
  }
  return out.join(' · ');
}
function mixColor(mix) {
  let best = 'ranged', bw = -1;
  for (const k in mix) if (mix[k] > bw) { bw = mix[k]; best = k; }
  return DMG_TYPES[best].color;

/* 基础属性：所有加成都由「升级等级 + 道具数量」重算，出售道具会真的掉属性 */
function baseStats() {
  return {
    maxHp: 120, speed: 215, regen: 0, armor: 0, pickup: 90,
    dmgPct: 0, rateMul: 1,
    crit: 0, critMul: 0,
    typeDmg: { melee: 0, ranged: 0, elem: 0, pct: 0 },
    pctHpMul: 1,
    projBonus: 0, pierceBonus: 0, bulletSpeedMul: 1, rangeMul: 1,
    bounce: 0, explodeMul: 1, spawnMul: 1, harvest: 0,
    lifesteal: 0, thorns: 0, killBomb: 0, killHeal: 0,
    matMul: 1, xpMul: 1, dodge: 0,
  };
}

/* 升级所需经验：12 级前线性，之后超线性，压制无限升级把后期刷爆 */
function xpNeed(level) {
  const late = Math.max(0, level - 12);
  return Math.round(8 + level * 6 + Math.pow(late, 1.9) * 4);
}

function recalcStats(p) {
  Object.assign(p, baseStats());
  for (const u of UPGRADES) {
    const lv = p.up[u.id] || 0;
    const rs = p.upRar && p.upRar[u.id];
    if (rs && rs.length) {
      // 按每次实际抽到的稀有度复现
      for (const r of rs) u.apply(p, RAR_SCALE[r] || 1);
    } else {
      for (let i = 1; i <= lv; i++) u.apply(p, RAR_SCALE[lvRarOf(i)]);
    }
  }
  for (const id in p.gear) {
    const g = GEAR_BY_ID[id];
    if (!g || !g.apply) continue;
    for (let i = 0; i < p.gear[id]; i++) g.apply(p);
  }
  // 乘性加成设上限，避免无限叠加后经济 / 刷怪 / 爆炸范围失控
  p.matMul = Math.min(2.5, p.matMul);
  p.spawnMul = Math.min(2, p.spawnMul);
  p.explodeMul = Math.min(3, p.explodeMul);
  p.hp = Math.min(p.hp, p.maxHp);
}

/* ---------- 武器辅助 ---------- */
// 所有武器同时开火：武器越多，单把射速略降，避免总输出直接翻三倍
function syncRateMul(p) { return 1 - 0.07 * (p.weapons.length - 1); }

function newWeapon(id, lv = 1) {
  return { id, lv, cd: 0, cdMax: 0.4, aim: -Math.PI / 2, flash: 0, recoil: 0 };
}

/* 武器结算：
   伤害 =（基础 + 对应伤害倍率 × 对应伤害）×（百分比增伤 + 1）
   —— 「基础」是武器自身伤害（随武器等级提升）；
      「对应伤害倍率」是这把武器该伤害类型的构成比例；
      「对应伤害」是玩家该类型的伤害值（升级/道具提供）；
      「百分比增伤」是玩家的全局增伤。暴击再乘武器暴伤倍率。 */
function weaponStats(p, w) {
  const def = WEAPONS[w.id];
  const mix = def.mix;
  const tot = mixTotal(mix);
  const isMelee = !!def.melee;
  // 每升一级的基础伤害增量取整，保证面板上的数字都是整数
  const lvStep = Math.max(1, Math.round(def.dmg * 0.22));
  const lvRate = 1 + (w.lv - 1) * 0.10;

  const base = def.dmg + (w.lv - 1) * lvStep;     // 基础伤害
  const typeAdd = Math.round(mixAdd(p, mix));     // 对应伤害倍率 × 对应伤害
  const dmg = Math.round((base + typeAdd) * (1 + p.dmgPct));

  return {
    def, lv: w.lv, mix, tot, isMelee,
    base, typeAdd, dmg,
    crit: clamp((def.crit || 0.05) + p.crit, 0, 0.95),
    critMul: (def.critMul || 2) + p.critMul,
    rate: def.rate * p.rateMul * lvRate * syncRateMul(p),
    speed: (def.speed || 600) * p.bulletSpeedMul,
    range: (isMelee ? def.melee.reach * p.rangeMul + 14 : def.range * p.rangeMul),
    reach: isMelee ? def.melee.reach * p.rangeMul + 14 : 0,
    arc: isMelee ? def.melee.arc : 0,
    kb: isMelee ? (def.melee.kb || 1) : 1,
    proj: (def.proj || 1) + p.projBonus,
    pierce: (def.pierce || 0) + p.pierceBonus,
    bounce: (def.bounce || 0) + p.bounce,
    explode: def.explode ? { r: def.explode.r * p.explodeMul, mul: def.explode.mul } : null,
    pctAmt: (mix.pct || 0) / tot * (def.pct || 0.012) * p.pctHpMul,
    elemShare: (mix.elem || 0) / tot,
    special: def.special || null,
    slow: def.slow, chain: def.chain,
  };
}

/* 出售价：远低于商店现价 */
function weaponSellValue(w) {
  const def = WEAPONS[w.id];
  return Math.max(6, Math.round(def.price * 0.22 * (1 + (w.lv - 1) * 0.7) * (1 + (G.wave - 1) * 0.04)));
}
function gearSellValue(g) {
  return Math.max(5, Math.round(g.price * 0.25 * (1 + (G.wave - 1) * 0.04)));
}

/* 合成：**必须是同一种武器 + 同一等级**，2 把 → 1 把高一级
   判定与执行都按「武器对象」而不是数组下标，避免列表变动后合错 */
function sameWeapons(p, id, lv) {
  return p.weapons.filter(w => w && w.id === id && w.lv === lv);
}
function canMerge(p, id, lv) {
  if (!Number.isInteger(lv) || lv < 1 || lv >= MAX_LV) return false;
  return sameWeapons(p, id, lv).length >= 2;
}
function doMerge(id, lv) {
  const p = G.player;
  if (!canMerge(p, id, lv)) return false;
  const pair = sameWeapons(p, id, lv).slice(0, 2);
  const a = pair[0], b = pair[1];
  const ia = p.weapons.indexOf(a), ib = p.weapons.indexOf(b);
  if (ia < 0 || ib < 0 || ia === ib) return false;
  const merged = newWeapon(id, lv + 1);
  merged.aim = a.aim;
  p.weapons[ia] = merged;
  p.weapons.splice(ib, 1);
  weaponSig = '';
  sfx('level');
  G.banner = { text: '合 成 成 功', sub: `${WEAPONS[id].name} ${lv} + ${lv} → Lv.${lv + 1}`, t: 1.2 };
  return true;
}

function startWave(n) {

  G.waveDuration = G.isBossWave ? Math.min(34, 26 + tier * 2) : Math.min(34, 18 + n * 1.5);
