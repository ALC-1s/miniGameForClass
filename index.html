/* =========================================================
   生成敌人
   ========================================================= */
function edgePoint() {
  const m = 26;
  const side = randInt(0, 3);
  if (side === 0) return { x: rand(m, W - m), y: m };
  if (side === 1) return { x: W - m, y: rand(m, H - m) };
  if (side === 2) return { x: rand(m, W - m), y: H - m };
  return { x: m, y: rand(m, H - m) };
}

/* 难度成长曲线：前中期平缓，8 波之后开始明显加速 */
function waveHpMul(w) {
  const late = Math.max(0, w - 10);
  return 1 + (w - 1) * 0.30 + Math.pow(late, 2.2) * 0.11;
}
function waveDmgMul(w) { return 1 + (w - 1) * 0.11; }
function waveSpdMul(w) { return Math.min(1 + (w - 1) * 0.024, 1.45); }

function initEnemy(key, x, y, extra) {
  const t = ENEMIES[key];
  const w = G.wave;
  const hpMul = t.neutral ? (1 + w * 0.5) : waveHpMul(w);
  const hp = t.hp * hpMul * (extra && extra.hpMul ? extra.hpMul : 1);
  const e = {
    id: G.uid++, type: key, x, y, r: t.r,
    hp, maxHp: hp,
    shieldHp: t.shield ? hp * 0.6 : 0,
    shieldMax: t.shield ? hp * 0.6 : 0,
    dr: t.dr || 0,
    neutral: !!t.neutral,
    speed: t.speed * waveSpdMul(w) * rand(0.92, 1.08),
    moveSpeed: t.speed * waveSpdMul(w),
    dmg: t.dmg * waveDmgMul(w), xp: t.xp,
    atkCd: 0, shootCd: rand(0.8, 1.8), hurt: 0, wob: rand(0, TAU), ang: 0,
    kbx: 0, kby: 0,
    slowMul: 1, slowT: 0, poisonT: 0, poisonDps: 0,
    phase: 'walk', ptimer: rand(1.2, 2.4),
  };
  return e;
}

function spawnEnemy() {
  if (G.enemies.length > 105) return;
  const w = G.wave;
  const pool = Object.entries(ENEMIES).filter(([, t]) => w >= t.minWave && !t.boss && t.weight > 0);
  let total = pool.reduce((s, [, t]) => s + t.weight, 0);
  let r = Math.random() * total, key = pool[0][0];
  for (const [k, t] of pool) { r -= t.weight; if (r <= 0) { key = k; break; } }

  const p = edgePoint();
  G.enemies.push(initEnemy(key, p.x, p.y));

  // 成群刷新的小怪
  const t = ENEMIES[key];
  if (t.pack) {
    for (let i = 1; i < t.pack; i++) {
      const q = edgePoint();
      G.enemies.push(initEnemy(key, q.x, q.y));
    }
  }
}

/* 场景道具：树 */
function spawnTree() {
  if (G.enemies.length > 105) return;
  const p = G.player;
  for (let tries = 0; tries < 24; tries++) {
    const x = rand(80, W - 80), y = rand(120, H - 80);
    if (dist2(x, y, p.x, p.y) < 150 * 150) continue;
    G.enemies.push(initEnemy('tree', x, y));
    burst(x, y, '#7be08a', 8, 110, 3);
    return;
  }
}

function spawnBoss() {
  const tier = Math.floor(G.wave / 5);
  const hp = 500 * Math.pow(1.9, tier - 1);
  const color = BOSS_COLORS[(tier - 1) % BOSS_COLORS.length];
  const b = {
    id: G.uid++, type: 'boss', boss: true, tier,
    x: W / 2, y: 120, r: 44 + Math.min(tier * 2, 10),
    hp, maxHp: hp,
    speed: 48 + tier * 4,
    moveSpeed: 48 + tier * 4,
    dmg: 18 + tier * 4, xp: 26 + tier * 8 + tier * 6,
    name: BOSS_NAMES[(tier - 1) % BOSS_NAMES.length],
    color, dr: Math.min(0.3, 0.1 + tier * 0.03),
    atkCd: 0, hurt: 0, wob: rand(0, TAU), ang: Math.PI / 2, kbx: 0, kby: 0,
    phase: 'chase', ptimer: 2.4, dashAng: 0, burstCd: 3.4, summonCd: 6.5,
    enter: 0.9, slowMul: 1, slowT: 0, poisonT: 0, poisonDps: 0, neutral: false,
  };
  G.enemies.push(b);
  G.boss = b;
  G.banner = { text: b.name, sub: 'BOSS 战 开始', t: 2.2 };
  G.shake = 12;
  sfx('boss');
}

/* =========================================================
   射击
   ========================================================= */
function shoot(p, w, s) {
  if (s.isMelee) { swing(p, w, s); return; }
  const def = s.def;
  const n = s.proj;
  const crit = Math.random() < s.crit;
  const dmg = s.dmg * (crit ? s.critMul : 1);
  const aim = w.aim;

  let angles;
  if (n <= 1) {
    angles = [0];
  } else {
    const step = def.proj > 1 ? def.spread / (def.proj - 1) : 0.10;
    angles = [];
    for (let i = 0; i < n; i++) angles.push((i - (n - 1) / 2) * step);
  }

  for (const off of angles) {
    const a = aim + off + (def.jitter ? rand(-def.jitter, def.jitter) : 0);
    G.bullets.push({
      x: p.x + Math.cos(aim) * 20, y: p.y + Math.sin(aim) * 20,
      vx: Math.cos(a) * s.speed, vy: Math.sin(a) * s.speed,
      r: def.br, dmg, crit,
      pierce: s.pierce, bounces: s.bounce, life: s.range / s.speed + 0.05,
      color: def.color, trail: def.color, wid: def.id, hit: null,
      special: s.special, slow: s.slow, chain: s.chain, explode: s.explode,
      pctAmt: s.pctAmt, elemShare: s.elemShare,
    });
  }

  w.flash = 0.07;
  w.recoil = 1;
  p.flash = 0.07;
  p.recoil = 1;

  // 枪口粒子（触屏设备减半，省性能）
  const nP = (def.id === 'shotgun' ? 6 : 3) * (IS_TOUCH ? 0.5 : 1);
  for (let i = 0; i < nP; i++) {
    const a = aim + rand(-0.4, 0.4);
    G.particles.push({
      x: p.x + Math.cos(aim) * 22, y: p.y + Math.sin(aim) * 22,
      vx: Math.cos(a) * rand(70, 220), vy: Math.sin(a) * rand(70, 220),
      r: rand(1.5, 3.6), life: 0.15, max: 0.15, color: '#ffe9a8',
    });
  }
  sfx(def.id === 'shotgun' ? 'shotgun' : def.id === 'rail' ? 'rail' : 'shoot');
}

/* 近战：一次挥砍命中扇形内所有目标 */
function swing(p, w, s) {
  const a = w.aim;
  w.flash = 0.16; w.recoil = 1; p.flash = 0.07; p.recoil = 1;
  G.slashes.push({ x: p.x, y: p.y, a, arc: s.arc, reach: s.reach, t: 0.18, max: 0.18, color: s.def.color });
  sfx('swing');

  const crit = Math.random() < s.crit;
  for (const e of [...G.enemies]) {
    const dx = e.x - p.x, dy = e.y - p.y;
    const d = Math.hypot(dx, dy) || 1;
    if (d > s.reach + e.r) continue;
    let da = Math.atan2(dy, dx) - a;
    da = Math.atan2(Math.sin(da), Math.cos(da));
    const pad = Math.atan2(e.r, Math.max(24, d));
    if (Math.abs(da) > s.arc / 2 + pad) continue;

    if (s.special === 'slow' && s.slow) {
      e.slowMul = s.slow.mul;
      e.slowT = Math.max(e.slowT || 0, s.slow.t);
    }
    hurtEnemy(e, s.dmg * (crit ? s.critMul : 1), crit, p.x, p.y, { elemShare: s.elemShare, silent: true });
    if (e.hp > 0 && s.pctAmt > 0) {
      hurtEnemy(e, e.maxHp * s.pctAmt, crit, p.x, p.y, { trueDmg: true, quiet: true, silent: true });
    }
    if (e.hp > 0) {
      e.kbx += Math.cos(a) * 130 * s.kb;
      e.kby += Math.sin(a) * 130 * s.kb;
    }
  }
  G.shake = Math.max(G.shake, 1.6);
}

function burst(x, y, color, n, spd = 160, size = 3) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), s = rand(spd * 0.3, spd);
    G.particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      r: rand(1.2, size), life: rand(0.2, 0.5), max: 0.5, color,
    });
  }
}

function damageText(x, y, val, crit) {
  G.texts.push({
    x: x + rand(-9, 9), y: y - 6, vy: -52, life: 0.62, max: 0.62,
    text: Math.round(val).toString(), crit,
  });
}

/* =========================================================
   伤害 / 死亡
   ========================================================= */
// 子弹命中：先挂状态，再结算伤害，最后触发爆炸/链电/弹射
function applyBulletHit(b, e) {
  const fx = b.x - b.vx * 0.02, fy = b.y - b.vy * 0.02;
  if (b.special === 'slow' && b.slow) {
    e.slowMul = b.slow.mul;
    e.slowT = Math.max(e.slowT || 0, b.slow.t);
  }
  if (b.special === 'poison') {
    e.poisonDps = Math.max(e.poisonDps || 0, b.dmg * 0.6);
    e.poisonT = 3;
  }
  hurtEnemy(e, b.dmg, b.crit, fx, fy, { elemShare: b.elemShare });

  // 百分比伤害：按目标最大生命结算，无视护甲与护盾
  if (b.pctAmt > 0 && e.hp > 0) {
    hurtEnemy(e, e.maxHp * b.pctAmt, b.crit, fx, fy, { trueDmg: true, quiet: true, silent: true });
  }

  if (b.special === 'chain' && b.chain) chainLightning(e, b, b.chain, b.dmg * 0.55, b.elemShare);
  if (b.special === 'explode' && b.explode) explodeAt(b.x, b.y, b.explode.r, b.dmg * b.explode.mul, b.crit);
}

function hurtEnemy(e, dmg, crit, fromX, fromY, opt) {
  opt = opt || {};
  const p = G.player;
  dmg = Math.max(1, Math.round(dmg));
  let rest = dmg;

  // 护甲减伤：百分比伤害无视
  if (!opt.trueDmg && e.dr > 0) rest *= (1 - e.dr);

  // 护盾：先扣护盾，元素伤害对护盾额外 60% 效果
  if (e.shieldHp > 0) {
    const eff = 1 + (opt.elemShare || 0) * 0.6;
    const ab = Math.min(e.shieldHp, rest * eff);
    e.shieldHp -= ab;
    rest -= ab / eff;
    if (e.shieldHp <= 0) {
      burst(e.x, e.y, '#a8e8ff', 14, 240, 3.6);
      G.texts.push({ x: e.x, y: e.y - e.r - 6, vy: -46, life: 0.8, max: 0.8, text: '破盾', crit: false, shield: true });
    }
  }

  if (rest > 0) e.hp -= rest;
  e.hurt = 0.12;
  if (!opt.quiet) damageText(e.x, e.y - e.r * 0.4, dmg, crit);

  // 吸血
  if (p && p.lifesteal > 0) p.hp = Math.min(p.maxHp, p.hp + p.lifesteal);

  const a = Math.atan2(e.y - fromY, e.x - fromX);
  const kb = (crit ? 90 : 55) * (e.boss ? 0.12 : 1) * (e.neutral ? 0.1 : 1);
  e.kbx += Math.cos(a) * kb;
  e.kby += Math.sin(a) * kb;

  burst(e.x, e.y, '#ffd0a0', crit ? 6 : 3, 180, 2.6);
  if (crit) G.shake = Math.max(G.shake, 3.2);

  if (e.hp <= 0) {
    killEnemy(e);
    return true;
  }
  if (!opt.silent) sfx('hit');
  return false;
}

// 范围爆炸伤害（榴弹 / 炸药袋）
function explodeAt(x, y, radius, dmg, crit) {
  burst(x, y, '#ffb066', 18, 300, 5);
  G.zaps.push({ x1: x, y1: y, x2: x, y2: y, r: radius, t: 0.22, ring: true });
  for (const e of [...G.enemies]) {
    const rr = radius + e.r;
    if (dist2(x, y, e.x, e.y) < rr * rr) {
      hurtEnemy(e, dmg, crit, x, y);
    }
  }
}

// 特斯拉链电：命中后跳到附近敌人
function chainLightning(src, b, count, dmg, elemShare) {
  let from = src;
  const seen = new Set([src.id]);
  for (let i = 0; i < count; i++) {
    let t = null, best = 200 * 200;
    for (const e of G.enemies) {
      if (seen.has(e.id)) continue;
      const d = dist2(from.x, from.y, e.x, e.y);
      if (d < best) { best = d; t = e; }
    }
    if (!t) return;
    seen.add(t.id);
    G.zaps.push({ x1: from.x, y1: from.y, x2: t.x, y2: t.y, t: 0.16 });
    hurtEnemy(t, dmg, false, from.x, from.y, { elemShare: elemShare || 1 });
    from = t;
  }
}

function killEnemy(e) {
  const t = ENEMIES[e.type];
  if (t.neutral) { killTree(e, t); return; }
  killEnemyInternal(e, t);
}

/* 树：大概率爆果子，小概率爆箱子（给一个道具） */
function killTree(e, t) {
  const idx = G.enemies.indexOf(e);
  if (idx < 0) return;
  G.enemies.splice(idx, 1);
  burst(e.x, e.y, '#8fe07a', 18, 240, 4.5);
  G.shake = Math.max(G.shake, 3);
  sfx('kill');

  if (Math.random() < 0.74) {
    const n = randInt(5, 8);
    for (let i = 0; i < n; i++) {
      G.drops.push({
        kind: 'fruit', x: e.x + rand(-10, 10), y: e.y + rand(-10, 10),
        vx: rand(-90, 90), vy: rand(-90, 90), life: 0, r: 6,
      });
    }
    G.texts.push({ x: e.x, y: e.y - 34, vy: -46, life: 1.0, max: 1.0, text: '果子！', crit: false, heal: true });
  } else {
    G.drops.push({ kind: 'chest', x: e.x, y: e.y, vx: 0, vy: 0, life: 0, r: 11 });
    G.texts.push({ x: e.x, y: e.y - 34, vy: -46, life: 1.0, max: 1.0, text: '宝箱！', crit: false, coin: true });
    sfx('buy');
  }
}

function killEnemyInternal(e, t) {
  const idx = G.enemies.indexOf(e);
  if (idx < 0) return;
  G.enemies.splice(idx, 1);
  G.kills++;

  const big = t.boss || t.r > 18;

  if (t.boss) {
    // BOSS 死亡演出
    for (let i = 0; i < 5; i++) {
      setTimeout(() => {
        if (G.state === 'dead') return;
        burst(e.x + rand(-40, 40), e.y + rand(-40, 40), e.color, 14, 320, 6);
      }, i * 90);
    }
    G.shake = 20;
    G.boss = null;
    G.bossDeadTimer = 1.4;
    G.xp += e.xp;
    G.mat += Math.round(e.xp * G.player.matMul);
    G.texts.push({ x: e.x, y: e.y - 62, vy: -40, life: 1.2, max: 1.2, text: `+${e.xp} 材料 / 经验`, crit: false, heal: true });
    const reward = Math.round((60 + G.wave * 8) * G.player.matMul);
    G.mat += reward;
    const heal = Math.round(G.player.maxHp * 0.25);
    G.player.hp = Math.min(G.player.maxHp, G.player.hp + heal);
    G.banner = { text: 'BOSS 击破！', sub: `+${reward} 🧩  +${heal} 生命`, t: 2.2 };
    G.texts.push({ x: e.x, y: e.y - 40, vy: -40, life: 1.2, max: 1.2, text: `+${reward}🧩`, crit: false, coin: true });
    sfx('boss');
    return;
  }

  burst(e.x, e.y, t.color, big ? 16 : 9, 220, big ? 4.5 : 3);
  G.shake = Math.max(G.shake, big ? 5 : 2);
  sfx('kill');

  const p = G.player;

  // 击杀回血
  if (p.killHeal > 0) p.hp = Math.min(p.maxHp, p.hp + p.killHeal);

  // 分裂怪的碎片
  if (t.split) {
    for (let i = 0; i < 2; i++) spawnAt(e.x + rand(-12, 12), e.y + rand(-12, 12), 'mini');
  }

  // 炸药袋：击杀引发小范围爆炸
  if (p.killBomb > 0) explodeAt(e.x, e.y, 64, 14 * p.killBomb, false);

  // 敌人只掉材料（材料同时提供经验），材料来自波次结算、BOSS 与出售

  // 材料（拾取时同时增加材料数与经验；数量过多时并入已有材料）
  let v = Math.max(1, Math.round(e.xp * p.matMul));
  if (p.xpMul > 1 && Math.random() < p.xpMul - 1) v += 1;
  const n = v >= 3 ? 3 : v;
  // 拆成整数份，避免材料出现小数（材料同时是货币）
  const base = Math.floor(v / n), extra = v % n;
  for (let i = 0; i < n; i++) {
    const val = base + (i < extra ? 1 : 0);
    if (G.gems.length >= 260) {
      G.gems[randInt(0, G.gems.length - 1)].value += val;
      continue;
    }
    G.gems.push({
      x: e.x + rand(-8, 8), y: e.y + rand(-8, 8),
      vx: rand(-60, 60), vy: rand(-60, 60),
      value: val, r: v >= 3 ? 6.5 : 5, life: 0,
    });
  }
}

function hurtPlayer(dmg) {
  const p = G.player;
  if (p.invuln > 0 || G.state !== 'playing') return;

  // 闪避
  if (p.dodge > 0 && Math.random() < p.dodge) {
    G.texts.push({ x: p.x, y: p.y - 26, vy: -50, life: 0.7, max: 0.7, text: '闪避', crit: false, heal: true });
    p.invuln = 0.2;
    return;
  }

  p.invuln = 0.5;
  // 护甲：递减的百分比减伤（1≈6%，10=40%，上限 80%），不再是一点扣一点
  const real = Math.max(1, dmg * (1 - armorDR(p.armor)));
  p.hp -= real;
  p.hurt = 0.28;
  G.shake = Math.max(G.shake, 6);
  sfx('hurt');

  // 尖刺甲：反伤
  if (p.thorns > 0) {
    G.zaps.push({ x1: p.x, y1: p.y, x2: p.x, y2: p.y, r: 92, t: 0.2, ring: true, color: '#9ef07a' });
    for (const e of [...G.enemies]) {
      if (dist2(e.x, e.y, p.x, p.y) < (e.r + 92) * (e.r + 92)) {
        hurtEnemy(e, p.thorns, false, p.x, p.y);
      }
    }
  }

  for (let i = 0; i < 8; i++) {
    const a = rand(0, TAU);
    G.particles.push({
      x: p.x, y: p.y, vx: Math.cos(a) * rand(40, 190), vy: Math.sin(a) * rand(40, 190),
      r: rand(1.5, 3), life: rand(0.2, 0.45), max: 0.45, color: '#ff6b7d',
    });
  }

  if (p.hp <= 0) {
    p.hp = 0;
    gameOver();
  }
}

function gameOver() {
  G.state = 'dead';
  burst(G.player.x, G.player.y, '#ff9a6b', 30, 320, 5);
  G.shake = 14;
  setTimeout(() => {
    if (G.state !== 'dead') return;
    panel.innerHTML = `
      <div class="over-title">被 埋 了</div>
      <div class="results">
        <div><span>到达波次</span><strong>${G.wave}</strong></div>
        <div><span>击杀数</span><strong>${G.kills}</strong></div>
        <div><span>等级</span><strong>${G.level}</strong></div>
      </div>
      <button class="btn" id="retry">再来一局</button>
      <div class="tip">按 R 快速重开</div>`;
    overlay.classList.remove('with-side');
    hideSide();
    overlay.classList.add('show');
    document.getElementById('retry').onclick = startGame;
  }, 420);
}

/* =========================================================
   升级（只在波次结束后结算）
   ========================================================= */
const HEAL_UP = { id: 'heal', icon: '🍲', name: '土豆浓汤', color: '#7ee0b8', max: 99, desc: '立刻回复 30% 生命', apply: p => { p.hp = Math.min(p.maxHp, p.hp + p.maxHp * 0.3); } };

const LV_CARDS = 4;

function lvPool() {
  // 没有等级上限，13 项永远全部可选
  return UPGRADES;
}

// 升级卡的稀有度：和商店道具同一套权重（越到后期越容易出高稀有度）
function rollUpRar() {
  const ws = [rarWeight(1), rarWeight(2), rarWeight(3), rarWeight(4)];
  let total = 0;
  for (const v of ws) total += v;
  let r = Math.random() * total;
  for (let i = 0; i < 4; i++) { r -= ws[i]; if (r <= 0) return i + 1; }
  return 1;
}

// 抽 4 张：本轮内不重复，每张各自随机一个稀有度
function rollLvCards(n) {
  const pool = lvPool().slice();
  const out = [];
  while (out.length < n && pool.length) {
    const u = pool.splice((Math.random() * pool.length) | 0, 1)[0];
    out.push({ u, rar: rollUpRar() });
  }
  while (out.length < n) out.push({ u: HEAL_UP, rar: 1 });
  return out;
}

// 刷新越来越贵：3 / 5 / 7 / 9 … 材料
function lvRerollCost() { return 3 + 2 * (G.lvRerolls || 0); }

function openLevelUp() {
  const fresh = G.state !== 'levelup';
  if (fresh) { G.lvRerolls = 0; G.lvCards = null; }
  if (!G.lvCards) G.lvCards = rollLvCards(LV_CARDS);
  G.state = 'levelup';
  overlay.classList.remove('with-side');
  hideSide();
  renderLevelUp();
  overlay.classList.add('show');
  if (fresh) sfx('level');
}

function renderLevelUp() {
  const p = G.player;
  const cost = lvRerollCost();
  const mat = Math.floor(G.mat);
  panel.innerHTML = `
    <div class="title" style="font-size:3.2cqw">升 级</div>
    <div class="subtitle">Lv.${G.level} · 剩余 ${G.pendingLevels} 次 · 每张卡随机稀有度</div>
    <div class="cards lv"></div>
    <div class="btnrow">
      <button class="btn ghost" id="skipLv">跳过剩余</button>
      <button class="btn ghost" id="lvRoll">刷新 ${cost} 🧩</button>
    </div>
    <div class="tip">材料 ${mat} 🧩 · 刷新价格逐次递增 · 稀有度越高效果越强，同一强化可无限叠加</div>`;

  const wrap = panel.querySelector('.cards.lv');

  G.lvCards.forEach(card => {
    const c = card.u, rar = card.rar || 1, k = RAR_SCALE[rar];
    const have = c.id === 'heal' ? 0 : (p.up[c.id] || 0);
    const lv = have + 1;
    const d = document.createElement('div');
    d.className = 'card rar' + rar;
    d.style.setProperty('--c', rarColor(rar));
    d.innerHTML = `
      <div class="rar-tag">${c.id === 'heal' ? '补给' : rarName(rar)}</div>
      <div class="ico">${c.icon}</div>
      <div class="nm">${c.name}</div>
      <div class="ds">${c.txt ? c.txt(k) : c.desc}</div>
      <div class="st">${c.id === 'heal' ? '随时可用' : `Lv.${lv}`}</div>`;
    d.onclick = () => pickUpgrade(card);
    wrap.appendChild(d);
  });

  const rb = document.getElementById('lvRoll');
  rb.disabled = mat < cost;
  rb.onclick = () => {
    if (Math.floor(G.mat) < cost) return;
    G.mat -= cost;
    G.lvRerolls = (G.lvRerolls || 0) + 1;
    G.lvCards = rollLvCards(LV_CARDS);
    sfx('buy');
    renderLevelUp();
    updateHUD();
  };

  document.getElementById('skipLv').onclick = () => {
    if (G.pendingLevels <= 0) return;
    G.pendingLevels = 0;
    G.lvCards = null;
    sfx('buy');
    openShop();
  };
}

function pickUpgrade(card) {
  const p = G.player;
  const c = card.u || card;
  const rar = card.rar || 1;
  if (c.id === 'heal') {
    c.apply(p);
  } else {
    const lv = (p.up[c.id] || 0) + 1;
    p.up[c.id] = lv;
    if (!p.upRar[c.id]) p.upRar[c.id] = [];
    p.upRar[c.id].push(rar);            // 记住这次选的是哪一档，重算时按档位复现
    recalcStats(p);
    if (c.onPick) c.onPick(p, RAR_SCALE[rar]);
  }
  G.pendingLevels--;
  G.lvCards = null;          // 选完自动刷新下一批
  sfx('level');
  updateHUD();
  if (G.pendingLevels > 0) openLevelUp();
  else openShop();
}

/* =========================================================
   商店（武器 + 道具共用一个权重池）
   ========================================================= */
function priceScale(base) { return Math.max(12, Math.round(base * (1 + (G.wave - 1) * 0.08))); }

// 波次越靠后，越容易刷出高稀有度物品
function rarWeight(r) {
  const w = G.wave;
  if (r === 1) return w <= 3 ? 18 : w <= 8 ? 12 : 7;
  if (r === 2) return w <= 3 ? 9 : w <= 8 ? 15 : 12;
  if (r === 3) return w <= 4 ? 2.5 : w <= 9 ? 10 : 13;
  return w <= 6 ? 0.6 : w <= 12 ? 6 : 11;
}

function gearAvailable(g, p) {
  const have = p.gear[g.id] || 0;
  if (g.max && have >= g.max) return false;
  return true;
}

function gearCard(g) {
  const have = G.player.gear[g.id] || 0;
  return {
    kind: 'gear', gid: g.id, rar: g.rar,
    icon: g.icon, name: g.name, desc: g.desc,
    price: priceScale(g.price), sold: false,
    note: `${rarName(g.rar)} · 已有 ${have}${g.max ? ' / ' + g.max : ''}`,
  };
}

function weaponCardFrom(entry) {
  const def = WEAPONS[entry.wid];
  if (!entry.wre) {
    return {
      kind: 'weapon', wid: entry.wid, up: false, rar: 1, lvTag: 1,
      icon: def.icon, name: def.name, desc: def.desc,
      price: priceScale(def.price), sold: false,
      note: `新武器 · 第 ${G.player.weapons.length + 1} 槽 · ${mixText(def.mix)}`,
    };
  }
  // 升级卡：绑定一把具体武器，卡面只显示「目标等级」这一个数字
  const w = entry.wre;
  const to = Math.min(MAX_LV, w.lv + 1);
  return {
    kind: 'weapon', wid: entry.wid, up: true, wre: w, srcLv: w.lv, rar: to, lvTag: to,
    icon: def.icon, name: def.name, desc: def.desc,
    price: priceScale(def.price * (0.5 + w.lv * 0.18)), sold: false,
    note: `Lv.${w.lv} 的${def.name}升到 Lv.${to} · ${mixText(def.mix)}`,
  };
}

/* 统一权重池：有空位 → 只出「新武器」，没位置 → 只出「武器升级」 */
function shopPool() {
  const p = G.player;
  const out = [];
  const canNew = p.weapons.length < MAX_SLOTS;

  if (canNew) {
    for (const id of WEAPON_KEYS) {
      const d = WEAPONS[id];
      if (d.minWave > G.wave) continue;
      out.push({ kind: 'weapon', wid: id, w: d.weight * 2.7 * rand(0.85, 1.15), rar: 1 });
    }
  } else {
    // 没位置 → 只出「把已有武器升一级」，绑定到具体那把
    for (const w of p.weapons) {
      if (w.lv >= MAX_LV) continue;
      out.push({ kind: 'weapon', wid: w.id, wre: w, w: WEAPONS[w.id].weight * 1.45, rar: w.lv + 1 });
    }
  }

  for (const g of GEAR) {
    if (!gearAvailable(g, p)) continue;
    out.push({ kind: 'gear', gid: g.id, w: rarWeight(g.rar), rar: g.rar });
  }
  return out;
}

function rollShop() {
  const pool = shopPool();
  const items = [];
  const usedW = new Set(), usedG = new Set();

  for (let k = 0; k < 4 && pool.length; k++) {
    const cand = pool.filter(e => e.kind === 'weapon' ? !usedW.has(e.wid) : !usedG.has(e.gid));
    if (!cand.length) break;
    let total = 0;
    for (const e of cand) total += e.w;
    let r = Math.random() * total, pick = cand[0];
    for (const e of cand) { r -= e.w; if (r <= 0) { pick = e; break; } }
    if (pick.kind === 'weapon') { usedW.add(pick.wid); items.push(weaponCardFrom(pick)); }
    else { usedG.add(pick.gid); items.push(gearCard(GEAR_BY_ID[pick.gid])); }
  }
  return { wave: G.wave, items };
}

function openShop() {
  if (G.pendingLevels > 0) { openLevelUp(); return; }
  if (!G.shop || G.shop.wave !== G.wave) { G.shop = rollShop(); G.shopRerolls = 0; }
  G.state = 'shop';
  renderShop();
}

/* =========================================================
   宝箱：波次结束 → 升级属性之前，决定「收下」还是「卖掉」
   ========================================================= */
let chestRoll = null;

function nextStep() {
  if (G.pendingLevels > 0) { openLevelUp(); return; }
  openShop();
}

function rollChestGear() {
  const p = G.player;
  const pool = GEAR.filter(g => gearAvailable(g, p));
  if (!pool.length) return null;
  let total = 0;
  for (const g of pool) total += rarWeight(g.rar);
  let r = Math.random() * total;
  for (const g of pool) { r -= rarWeight(g.rar); if (r <= 0) return g; }
  return pool[0];
}

function openChest() {
  G.state = 'chest';
  overlay.classList.remove('with-side');
  hideSide();
  chestRoll = rollChestGear();
  renderChest();
  overlay.classList.add('show');
  sfx('coin');
}

function renderChest() {
  const p = G.player;
  const g = chestRoll;
  const rar = g ? g.rar : 1;
  const have = g ? (p.gear[g.id] || 0) : 0;
  const sell = g ? gearSellValue(g) : 40;

  panel.innerHTML = `
    <div class="title" style="font-size:3.2cqw">宝 箱</div>
    <div class="subtitle">第 ${G.wave} 波收获 · 待开 ${G.chests} 个</div>
    <div class="cards lv one"></div>
    <div class="btnrow">
      <button class="btn" id="chestTake">收 下</button>
      <button class="btn ghost" id="chestSell">卖掉 +${sell} 🧩</button>
    </div>
    <div class="tip">${g ? `收下即装备（已持有 ${have}）· 卖掉换成材料` : '宝箱是空的，直接换材料'}</div>`;

  const wrap = panel.querySelector('.cards.lv');
  const d = document.createElement('div');
  d.className = 'card rar' + rar;
  d.style.setProperty('--c', rarColor(rar));
  d.innerHTML = `
    <div class="rar-tag">${g ? rarName(rar) : '材料'}</div>
    <div class="ico">${g ? g.icon : '🧩'}</div>
    <div class="nm">${g ? g.name : '一堆材料'}</div>
    <div class="ds">${g ? g.desc : `+${sell} 材料`}</div>
    <div class="st">${g ? `已持有 ${have}` : '空箱子'}</div>`;
  wrap.appendChild(d);

  document.getElementById('chestTake').onclick = () => {
    if (g) {
      p.gear[g.id] = (p.gear[g.id] || 0) + 1;
      recalcStats(p);
      if (g.onBuy) g.onBuy(p);
      G.banner = { text: '宝 箱', sub: `获得道具 ${g.icon} ${g.name}`, t: 1.6 };
      sfx('buy');
    } else {
      G.mat += sell;
      sfx('buy');
    }
    chestRoll = null;
    G.chests--;
    updateHUD();
    if (G.chests > 0) openChest();
    else nextStep();
  };

  document.getElementById('chestSell').onclick = () => {
    G.mat += sell;
    G.banner = { text: '卖 掉', sub: `${g ? g.name : '材料'} → +${sell} 🧩`, t: 1.4 };
    sfx('sell');
    chestRoll = null;
    G.chests--;
    updateHUD();
    if (G.chests > 0) openChest();
    else nextStep();
  };
}

/* 刷新价格：12 / 18 / 24 …；本页商品全部买完则免费 */
function shopRerollCost() {
  const s = G.shop;
  if (s && s.items.length && s.items.every(i => i.sold)) return 0;
  return 12 + 6 * (G.shopRerolls || 0);
}

function renderShop() {
  const s = G.shop;
  if (!s) return;
  const p = G.player;
  const rcost = shopRerollCost();
  closeSellPop();
  panel.innerHTML = `
    <div class="shop-head">商 店<span>🧩 ${G.mat}</span></div>
    <div class="shop-sub">第 ${G.wave} 波结束 · 下一波：第 ${G.wave + 1} 波${(G.wave + 1) % 5 === 0 ? '（BOSS）' : ''}</div>
    <div class="cards shop"></div>
    <div class="btnrow">
      <button class="btn" id="go">进入第 ${G.wave + 1} 波</button>
      <button class="btn ghost" id="reroll">${rcost > 0 ? `刷新 ${rcost} 🧩` : '免费刷新'}</button>
    </div>
    <div class="tip">武器 ${p.weapons.length}/${MAX_SLOTS} 槽 · 点右侧武器/道具可出售或合成 · 悬停看属性${rcost === 0 ? ' · 商品已买完，刷新免费' : ''}</div>`;

  const wrap = panel.querySelector('.cards.shop');

  s.items.forEach(it => {
    const d = document.createElement('div');
    // 买过 / 目标已不存在的升级卡 → 位置留空
    const dead = it.up && (!it.wre || p.weapons.indexOf(it.wre) < 0 || it.wre.lv >= MAX_LV);
    if (it.sold) {
      d.className = 'card blank';
      wrap.appendChild(d);
      return;
    }
    d.className = 'card rar' + (it.rar || 1) + (dead ? ' locked' : '');
    d.style.setProperty('--c', rarColor(it.rar || 1));
    const afford = G.mat >= it.price && !dead;
    if (!afford) d.classList.add('locked');
    const tag = `${rarName(it.rar || 1)}${it.lvTag ? ' Lv.' + it.lvTag : ''}`;
    d.innerHTML = `
      <div class="rar-tag">${tag}</div>
      <div class="ico">${it.icon}</div>
      <div class="nm">${it.name}</div>
      <div class="ds">${it.desc}</div>
      <div class="st">${dead ? '目标已不存在' : (it.note || '')}</div>
      <div class="price">${it.price + ' 🧩'}</div>`;
    if (afford) {
      d.onclick = () => buyItem(it);
    } else if (!dead) {
      d.onclick = () => {
        d.animate([
          { transform: 'translateX(0)' }, { transform: 'translateX(-6px)' },
          { transform: 'translateX(6px)' }, { transform: 'translateX(0)' },
        ], { duration: 180 });
        sfx('hurt');
      };
    }
    wrap.appendChild(d);
  });

  document.getElementById('go').onclick = () => {
    overlay.classList.remove('show', 'with-side');
    hideSide();
    closeSellPop();
    startWave(G.wave + 1);
    updateHUD();
  };
  const rb = document.getElementById('reroll');
  rb.disabled = rcost === 0 ? false : G.mat < rcost;
  rb.onclick = () => {
    if (rcost > 0 && G.mat < rcost) return;
    if (rcost > 0) { G.mat -= rcost; G.shopRerolls = (G.shopRerolls || 0) + 1; }
    G.shop = rollShop();
    sfx('buy');
    renderShop();
    updateHUD();
  };

  overlay.classList.add('show', 'with-side');
  showSide();
}

function buyItem(it) {
  if (it.sold || G.mat < it.price) return;
  const p = G.player;
  if (it.kind === 'weapon') {
    if (it.up) {
      // 只升级卡面绑定的那把；它被卖掉/合掉了就买不了
      if (!it.wre || p.weapons.indexOf(it.wre) < 0 || it.wre.lv >= MAX_LV) return false;
    } else if (p.weapons.length >= MAX_SLOTS) {
      return false;
    }
  }

  G.mat -= it.price;
  it.sold = true;

  if (it.kind === 'weapon') {
    if (it.up) {
      it.wre.lv++;
    } else {
      p.weapons.push(newWeapon(it.wid));
    }
  } else if (it.kind === 'gear') {
    const g = GEAR_BY_ID[it.gid];
    if (g) {
      p.gear[g.id] = (p.gear[g.id] || 0) + 1;
      recalcStats(p);
      if (g.onBuy) g.onBuy(p);
    }
  }

  sfx('buy');
  weaponSig = '';
  renderShop();
  renderWeapons();
  updateHUD();
  return true;
}

/* =========================================================
   更新
   ========================================================= */
function update(dt) {
  G.time += dt;
  G.shake = Math.max(0, G.shake - dt * 32);
  if (G.banner) { G.banner.t -= dt; if (G.banner.t <= 0) G.banner = null; }

  updateParticles(dt);
  updateTexts(dt);
  updateZaps(dt);

  if (G.state === 'intermission') {
    G.interTimer -= dt;
    updatePickups(dt, true);
    if (G.interTimer > 0) return;
    // 结算顺序：先开宝箱，再升级属性，最后商店
    if (G.chests > 0) { openChest(); return; }
    nextStep();
    return;
  }
  if (G.state !== 'playing') return;

  const p = G.player;
  if (!p) return;

  /* --- 玩家移动（键盘 + 触摸摇杆）--- */
  let ix = 0, iy = 0;
  if (keys.has('KeyA') || keys.has('ArrowLeft')) ix -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) ix += 1;
  if (keys.has('KeyW') || keys.has('ArrowUp')) iy -= 1;
  if (keys.has('KeyS') || keys.has('ArrowDown')) iy += 1;
  ix += touchVec.x; iy += touchVec.y;
  const len = Math.hypot(ix, iy);
  if (len > 1) { ix /= len; iy /= len; }

  const accel = 1 - Math.exp(-dt * 18);
  p.vx = lerp(p.vx, ix * p.speed, accel);
  p.vy = lerp(p.vy, iy * p.speed, accel);
  // 触屏时留出边距，别让角色钻到 HUD 底下
  const edge = IS_TOUCH ? 24 : 6;
  p.x = clamp(p.x + p.vx * dt, p.r + edge, W - p.r - edge);
  p.y = clamp(p.y + p.vy * dt, p.r + edge, H - p.r - edge * 1.4);
  if (ix || iy) p.walk += dt * 12;

  p.hurt = Math.max(0, p.hurt - dt);
  p.invuln = Math.max(0, p.invuln - dt);
  p.flash = Math.max(0, p.flash - dt);
  /* 生命再生：每滴血跳一次，regen 越高间隔越短（下限 0.01 秒） */
  if (p.regen > 0 && p.hp < p.maxHp) {
    const iv = regenInterval(p.regen);
    p.regenAcc = (p.regenAcc || 0) + dt;
    let guard = 0;
    while (p.regenAcc >= iv && p.hp < p.maxHp && guard++ < 240) {
      p.regenAcc -= iv;
      p.hp = Math.min(p.maxHp, p.hp + 1);
    }
    if (p.hp >= p.maxHp) p.regenAcc = 0;
  } else if (p.regen <= 0) {
    p.regenAcc = 0;
  }

  /* --- 自动瞄准 + 所有武器同时开火 --- */
  // 身体朝向 = 最近的敌人（哪怕不在射程内），眼睛有方向感
  let faceT = null, faceBest = Infinity;
  for (const e of G.enemies) {
    if (e.neutral) continue;
    const d = dist2(p.x, p.y, e.x, e.y);
    if (d < faceBest) { faceBest = d; faceT = e; }
  }
  if (!faceT) {
    // 场上只有树时也会去砍树
    for (const e of G.enemies) {
      const d = dist2(p.x, p.y, e.x, e.y);
      if (d < faceBest) { faceBest = d; faceT = e; }
    }
  }
  if (faceT) p.aim = Math.atan2(faceT.y - p.y, faceT.x - p.x);

  const claimed = new Set();
  for (const w of p.weapons) {
    const s = weaponStats(p, w);
    w.cd -= dt;
    w.flash = Math.max(0, w.flash - dt);
    w.recoil = Math.max(0, w.recoil - dt * 7);

    // 每把武器按自己的射程挑目标；优先打还没被别的枪锁定的怪，避免全打同一只
    // 树是中立单位：只有在没有别的目标时才会被攻击
    let t = null, best = s.range * s.range;
    for (const e of G.enemies) {
      if (e.neutral || claimed.has(e.id)) continue;
      const d = dist2(p.x, p.y, e.x, e.y);
      if (d < best) { best = d; t = e; }
    }
    if (!t) {
      best = s.range * s.range;
      for (const e of G.enemies) {
        if (claimed.has(e.id)) continue;
        const d = dist2(p.x, p.y, e.x, e.y);
        if (d < best) { best = d; t = e; }
      }
    }
    if (!t) { w.aim = p.aim; continue; }
    claimed.add(t.id);

    w.aim = Math.atan2(t.y - p.y, t.x - p.x);
    if (w.cd <= 0) {
      w.cdMax = 1 / s.rate;
      w.cd = w.cdMax;
      shoot(p, w, s);
    }
  }

  /* --- 敌人 --- */
  for (let i = G.enemies.length - 1; i >= 0; i--) {
    const e = G.enemies[i];
    if (!e) continue;   // 循环中 AOE 可能一次删掉多个，索引可能越界
    const t = ENEMIES[e.type];
    e.hurt = Math.max(0, e.hurt - dt);
    e.wob += dt * (e.type === 'sprinter' ? 14 : 6);

    // 中毒：持续掉血
    if (e.poisonT > 0) {
      e.poisonT -= dt;
      e.hp -= e.poisonDps * dt;
      if (Math.random() < dt * 6) burst(e.x, e.y, '#9ef07a', 1, 60, 2);
      if (e.hp <= 0) { killEnemy(e); continue; }
    }
    // 减速
    let slow = 1;
    if (e.slowT > 0) { e.slowT -= dt; slow = e.slowMul || 1; }

    const dx = p.x - e.x, dy = p.y - e.y;
    const d = Math.hypot(dx, dy) || 1;
    e.ang = Math.atan2(dy, dx);

    let mvx = dx / d, mvy = dy / d;
    e.moveSpeed = e.speed * slow;

    // 中立的树：不移动、不攻击，只挨打
    if (e.neutral) {
      e.x += e.kbx * dt; e.y += e.kby * dt;
      e.kbx *= Math.pow(0.0025, dt); e.kby *= Math.pow(0.0025, dt);
      e.x = clamp(e.x, e.r, W - e.r);
      e.y = clamp(e.y, e.r, H - e.r);
      continue;
    }

    if (t.boss) {
      updateBossAI(e, dt, p, d);
      mvx = Math.cos(e.dashAng);
      mvy = Math.sin(e.dashAng);
      if (e.phase === 'windup') { mvx = 0; mvy = 0; }
      if (e.phase === 'chase') { mvx = dx / d; mvy = dy / d; }
    } else if (t.ranged) {
      if (d < 210) { mvx *= -1; mvy *= -1; }
      else if (d < 260) { mvx *= 0.15; mvy *= 0.15; }
      e.shootCd -= dt;
      if (e.shootCd <= 0 && d < 420) {
        e.shootCd = rand(1.8, 2.6);
        const a = Math.atan2(dy, dx);
        const shots = t.triple ? 3 : 1;
        for (let k = 0; k < shots; k++) {
          const off = (k - (shots - 1) / 2) * 0.24;
          G.ebullets.push({
            x: e.x, y: e.y,
            vx: Math.cos(a + off) * (t.triple ? 210 : 190),
            vy: Math.sin(a + off) * (t.triple ? 210 : 190),
            r: 5.5, dmg: e.dmg * 0.7, life: 3.2,
          });
        }
      }
    } else if (t.charger) {
      e.ptimer -= dt;
      if (e.phase === 'walk') {
        if (e.ptimer <= 0 && d < 430) { e.phase = 'windup'; e.ptimer = 0.45; }
      } else if (e.phase === 'windup') {
        e.moveSpeed = 0;
        e.dashAng = Math.atan2(dy, dx);
        if (e.ptimer <= 0) {
          e.phase = 'dash'; e.ptimer = 0.34;
          burst(e.x, e.y, '#7b8cff', 6, 180, 3);
        }
      } else {
        e.moveSpeed = 540 * slow;
        mvx = Math.cos(e.dashAng); mvy = Math.sin(e.dashAng);
        if (e.ptimer <= 0) { e.phase = 'walk'; e.ptimer = rand(1.7, 2.6); }
      }
    } else if (t.suicide) {
      // 自爆虫：贴身直接炸
      if (d < 42) {
        G.zaps.push({ x1: e.x, y1: e.y, x2: e.x, y2: e.y, r: 78, t: 0.24, ring: true, color: '#ff9a3d' });
        burst(e.x, e.y, '#ff9a3d', 20, 300, 5);
        G.shake = Math.max(G.shake, 7);
        for (const o of [...G.enemies]) {
          if (o === e) continue;
          if (dist2(e.x, e.y, o.x, o.y) < (o.r + 78) * (o.r + 78)) hurtEnemy(o, e.dmg * 0.5, false, e.x, e.y);
        }
        hurtPlayer(e.dmg * 1.25);
        killEnemy(e);
        if (G.state !== 'playing') return;
        continue;
      }
    }

    e.x += (mvx * e.moveSpeed + e.kbx) * dt;
    e.y += (mvy * e.moveSpeed + e.kby) * dt;
    e.kbx *= Math.pow(0.0025, dt);
    e.kby *= Math.pow(0.0025, dt);
    e.x = clamp(e.x, e.r, W - e.r);
    e.y = clamp(e.y, e.r, H - e.r);

    // 碰撞玩家
    const rr = e.r + p.r;
    if (dist2(e.x, e.y, p.x, p.y) < rr * rr) {
      e.atkCd -= dt;
      if (e.atkCd <= 0) {
        e.atkCd = t.boss ? 0.7 : 0.8;
        hurtPlayer(e.dmg);
        if (G.state !== 'playing') return;
      }
    } else if (e.atkCd > 0) {
      e.atkCd = Math.max(0, e.atkCd - dt * 0.5);
    }
  }

  // 敌人互相挤开
  const n = G.enemies.length;
  for (let i = 0; i < n; i++) {
    const a = G.enemies[i];
    for (let j = i + 1; j < n; j++) {
      const b = G.enemies[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const min = a.r + b.r;
      const d2 = dx * dx + dy * dy;
      if (d2 < min * min && d2 > 0.01) {
        const dd = Math.sqrt(d2);
        const push = (min - dd) * 0.5;
        const ux = dx / dd, uy = dy / dd;
        const wa = a.boss ? 0.08 : (a.neutral ? 0 : 1), wb = b.boss ? 0.08 : (b.neutral ? 0 : 1);
        const tot = wa + wb || 1;
        a.x -= ux * push * 2 * (wa / tot); a.y -= uy * push * 2 * (wa / tot);
        b.x += ux * push * 2 * (wb / tot); b.y += uy * push * 2 * (wb / tot);
      }
    }
  }

  /* --- 子弹 --- */
  for (let i = G.bullets.length - 1; i >= 0; i--) {
    const b = G.bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.life -= dt;

    if (b.life <= 0 || b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) {
      G.bullets.splice(i, 1);
      continue;
    }

    let dead = false;
    for (const e of [...G.enemies]) {
      if (b.hit && b.hit.has(e.id)) continue;
      const rr = e.r + b.r;
      if (dist2(b.x, b.y, e.x, e.y) < rr * rr) {
        if (!b.hit) b.hit = new Set();
        b.hit.add(e.id);
        applyBulletHit(b, e);
        if (b.pierce > 0) { b.pierce--; break; }
        // 弹射：命中后转向最近的未命中目标
        if (b.bounces > 0) {
          let t2 = null, bd = 280 * 280;
          for (const o of G.enemies) {
            if (b.hit.has(o.id)) continue;
            const dd = dist2(b.x, b.y, o.x, o.y);
            if (dd < bd) { bd = dd; t2 = o; }
          }
          if (t2) {
            b.bounces--;
            const a2 = Math.atan2(t2.y - b.y, t2.x - b.x);
            const sp = Math.hypot(b.vx, b.vy);
            b.vx = Math.cos(a2) * sp;
            b.vy = Math.sin(a2) * sp;
            b.life = Math.max(b.life, 0.4);
            b.color = '#8ef0c8';
            break;
          }
        }
        dead = true;
        break;
      }
    }
    if (dead) G.bullets.splice(i, 1);
  }

  /* --- 敌方子弹 --- */
  for (let i = G.ebullets.length - 1; i >= 0; i--) {
    const b = G.ebullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.life -= dt;
    if (b.life <= 0 || b.x < -30 || b.x > W + 30 || b.y < -30 || b.y > H + 30) {
      G.ebullets.splice(i, 1);
      continue;
    }
    const rr = b.r + p.r;
    if (dist2(b.x, b.y, p.x, p.y) < rr * rr) {
      hurtPlayer(b.dmg);
      G.ebullets.splice(i, 1);
      if (G.state !== 'playing') return;
    }
  }

  /* --- 拾取物 --- */
  updatePickups(dt, false);

  /* --- 刷怪 --- */
  G.waveTime += dt;
  if (G.isBossWave && !G.boss && G.bossDeadTimer <= 0 && G.bossSpawnTimer > 0) {
    G.bossSpawnTimer -= dt;
    if (G.bossSpawnTimer <= 0) spawnBoss();
  }
  // 树的投放
  if (G.treesLeft > 0) {
    G.treeTimer -= dt;
    if (G.treeTimer <= 0) {
      G.treeTimer = rand(2.2, 3.6);
      G.treesLeft--;
      spawnTree();
    }
  }
  const spawnBoost = Math.min(2.0, Math.max(1, p.spawnMul));
  const interval = (G.isBossWave ? 1.85 : 1) * clamp(0.95 - G.wave * 0.05, 0.18, 0.95) / spawnBoost;
  if (G.bossDeadTimer <= 0) {
    G.spawnTimer -= dt;
    if (G.spawnTimer <= 0) {
      G.spawnTimer = interval * rand(0.8, 1.2);
      let batch = 1;
      if (G.wave >= 6 && Math.random() < 0.35) batch++;
      if (G.wave >= 12 && Math.random() < 0.35) batch++;
      if (G.wave >= 18 && Math.random() < 0.3) batch++;
      if (Math.random() < (spawnBoost - 1) * 0.6) batch++;
      for (let k = 0; k < batch; k++) spawnEnemy();
    }
  }

  /* --- BOSS 谢幕 --- */
  if (G.bossDeadTimer > 0) {
    G.bossDeadTimer -= dt;
    if (G.bossDeadTimer <= 0) { endWave(true); updateHUD(); return; }
  }

  /* --- 波次结束 --- */
  if (G.waveTime >= G.waveDuration) {
    if (G.boss) {
      // BOSS 逃走了
      burst(G.boss.x, G.boss.y, '#8fa5c4', 20, 260, 5);
      G.boss = null;
      G.banner = { text: 'BOSS 逃走了', sub: '下次再战', t: 1.8 };
    }
    endWave(false); updateHUD(); return;
  }

  /* --- 升级（属性强化留到波次结束后选） --- */
  while (G.xp >= G.xpNext) {
    G.xp -= G.xpNext;
    G.level++;
    G.xpNext = xpNeed(G.level);
    G.pendingLevels++;
    if (G.pendingLevels === 1) {
      G.texts.push({ x: p.x, y: p.y - 42, vy: -44, life: 1.1, max: 1.1, text: '升级！波次结束选强化', crit: false, coin: true });
    }
  }

  updateHUD();
}

/* ---------- BOSS 行为 ---------- */
function updateBossAI(e, dt, p, d) {
  e.ptimer -= dt;
  e.burstCd -= dt;
  e.summonCd -= dt;

  if (e.phase === 'chase') {
    e.moveSpeed = e.speed;
    if (e.ptimer <= 0 && d < 520) {
      e.phase = 'windup';
      e.ptimer = 0.55;
      sfx('roar');
    }
  } else if (e.phase === 'windup') {
    e.moveSpeed = 0;
    e.dashAng = Math.atan2(p.y - e.y, p.x - e.x);
    if (e.ptimer <= 0) {
      e.phase = 'dash';
      e.ptimer = 0.45;
    }
  } else if (e.phase === 'dash') {
    e.moveSpeed = 620;
    burst(e.x, e.y, e.color, 2, 120, 3);
    if (e.ptimer <= 0) {
      e.phase = 'chase';
      e.ptimer = rand(2.6, 4.2);
    }
  }

  // 环形弹幕
  if (e.burstCd <= 0 && e.phase !== 'windup') {
    e.burstCd = Math.max(1.6, 3.4 - e.tier * 0.15);
    const cnt = 12 + Math.min(e.tier * 2, 8);
    const base = Math.atan2(p.y - e.y, p.x - e.x);
    for (let i = 0; i < cnt; i++) {
      const a = base + (i / cnt) * TAU;
      G.ebullets.push({
        x: e.x + Math.cos(a) * (e.r + 6), y: e.y + Math.sin(a) * (e.r + 6),
        vx: Math.cos(a) * 210, vy: Math.sin(a) * 210,
        r: 6, dmg: e.dmg * 0.55, life: 4,
      });
    }
    burst(e.x, e.y, e.color, 10, 200, 4);
  }

  // 召唤小怪
  if (e.summonCd <= 0) {
    e.summonCd = 7.5;
    for (let i = 0; i < 3; i++) {
      const a = rand(0, TAU), rd = e.r + 30;
      spawnAt(e.x + Math.cos(a) * rd, e.y + Math.sin(a) * rd, Math.random() < 0.5 ? 'grunt' : 'sprinter');
    }
    burst(e.x, e.y, '#ffffff', 8, 180, 3);
  }
}

function spawnAt(x, y, key, hpScale) {
  if (G.enemies.length > 120) return;
  G.enemies.push(initEnemy(key, clamp(x, 20, W - 20), clamp(y, 20, H - 20), { hpMul: hpScale || 1 }));
}

/* ---------- 波次结束 ---------- */
function endWave(bossKilled) {
  for (const e of [...G.enemies]) {
    burst(e.x, e.y, '#8fa5c4', 6, 160, 3);
  }
  G.enemies.length = 0;
  G.ebullets.length = 0;
  G.boss = null;
  G.bossDeadTimer = 0;
  G.treesLeft = 0;

  const p = G.player;
  const heal = Math.round(p.maxHp * 0.5);
  p.hp = Math.min(p.maxHp, p.hp + heal);

  // 波次结束不再给材料；只有「收获」按数值给同等的材料与经验
  let harvestTxt = '';
  if (p.harvest > 0) {
    G.mat += p.harvest;
    G.xp += p.harvest;
    harvestTxt = `  ·  收获 +${p.harvest}`;
    G.texts.push({ x: p.x, y: p.y - 54, vy: -42, life: 1.2, max: 1.2, text: `收获 +${p.harvest} 材料/经验`, crit: false, heal: true });
  }

  G.texts.push({ x: p.x, y: p.y - 30, vy: -40, life: 1.1, max: 1.1, text: `+${heal}`, crit: false, heal: true });

  G.state = 'intermission';
  G.interTimer = 1.3;
  // 场上没来得及捡的宝箱直接收进待开列表
  for (const d of G.drops) if (d.kind === 'chest') G.chests = (G.chests || 0) + 1;
  G.drops.length = 0;
  G.banner = { text: `第 ${G.wave} 波 清除`, sub: `回复 ${heal} 生命${harvestTxt}`, t: 1.3 };
  sfx('level');
}

/* =========================================================
   拾取物
   ========================================================= */
function updateParticles(dt) {
  for (let i = G.particles.length - 1; i >= 0; i--) {
    const q = G.particles[i];
    q.x += q.vx * dt; q.y += q.vy * dt;
    q.vx *= Math.pow(0.06, dt); q.vy *= Math.pow(0.06, dt);
    q.life -= dt;
    if (q.life <= 0) G.particles.splice(i, 1);
  }
}

function updateTexts(dt) {
  for (let i = G.texts.length - 1; i >= 0; i--) {
    const t = G.texts[i];
    t.y += t.vy * dt;
    t.vy *= Math.pow(0.2, dt);
    t.life -= dt;
    if (t.life <= 0) G.texts.splice(i, 1);
  }
}

function updateZaps(dt) {
  for (let i = G.zaps.length - 1; i >= 0; i--) {
    G.zaps[i].t -= dt;
    if (G.zaps[i].t <= 0) G.zaps.splice(i, 1);
  }
  for (let i = G.slashes.length - 1; i >= 0; i--) {
    G.slashes[i].t -= dt;
    if (G.slashes[i].t <= 0) G.slashes.splice(i, 1);
  }
}

function updatePickups(dt, eager) {
  const p = G.player;
  if (!p) return;
  const pr = eager ? 99999 : p.pickup;

  const step = (arr, onGet, color) => {
    for (let i = arr.length - 1; i >= 0; i--) {
      const g = arr[i];
      g.x += g.vx * dt; g.y += g.vy * dt;
      g.vx *= Math.pow(0.02, dt); g.vy *= Math.pow(0.02, dt);
      g.life += dt;

      const dx = p.x - g.x, dy = p.y - g.y;
      const d = Math.hypot(dx, dy) || 1;

      if (d < pr) {
        const pull = eager ? 900 : lerp(260, 1100, 1 - d / pr);
        g.x += (dx / d) * pull * dt;
        g.y += (dy / d) * pull * dt;
      }
      if (d < 20) {
        onGet(g);
        arr.splice(i, 1);
        G.particles.push({ x: g.x, y: g.y, vx: 0, vy: -30, r: 3, life: 0.2, max: 0.2, color });
      }
    }
  };

  // 材料：同时提供材料数与经验
  step(G.gems, g => { G.xp += g.value; G.mat += g.value; sfx('gem'); }, '#7dffc4');

  // 果子 / 宝箱
  for (let i = G.drops.length - 1; i >= 0; i--) {
    const d = G.drops[i];
    d.x += d.vx * dt; d.y += d.vy * dt;
    d.vx *= Math.pow(0.02, dt); d.vy *= Math.pow(0.02, dt);
    d.life += dt;

    const dx = p.x - d.x, dy = p.y - d.y;
    const dd = Math.hypot(dx, dy) || 1;
    if (dd < pr) {
      const pull = eager ? 900 : lerp(240, 1000, 1 - dd / pr);
      d.x += (dx / dd) * pull * dt;
      d.y += (dy / dd) * pull * dt;
    }
    if (dd < 22) {
      if (d.kind === 'fruit') {
        const heal = Math.max(3, p.maxHp * 0.05);
        p.hp = Math.min(p.maxHp, p.hp + heal);
        G.mat += 1; G.xp += 1;
        G.texts.push({ x: d.x, y: d.y - 16, vy: -46, life: 0.8, max: 0.8, text: `+${Math.round(heal)}`, crit: false, heal: true });
        sfx('coin');
      } else {
        // 宝箱先收起来，波次结束后再决定收下还是卖掉
        G.chests = (G.chests || 0) + 1;
        G.texts.push({ x: d.x, y: d.y - 16, vy: -46, life: 0.9, max: 0.9, text: '宝箱 +1', crit: false, coin: true });
        sfx('buy');
      }
      G.drops.splice(i, 1);
    }
  }
}

/* =========================================================
   HUD
   ========================================================= */
function updateHUD() {
  const p = G.player;
  if (!p) return;
  const hp = Math.max(0, p.hp);
  el.hpfill.style.width = (hp / p.maxHp * 100).toFixed(1) + '%';
  el.hptext.textContent = `${Math.ceil(hp)} / ${Math.round(p.maxHp)}`;
  el.wave.textContent = `第 ${G.wave} 波`;
  const remain = Math.max(0, G.waveDuration - G.waveTime);
  el.time.textContent = Math.ceil(remain) + 's';
  el.kill.textContent = G.kills;
  el.lv.textContent = G.level;
  el.lvPend.textContent = G.pendingLevels > 0 ? ` +${G.pendingLevels}` : '';
  el.xp.style.width = (clamp(G.xp / G.xpNext, 0, 1) * 100).toFixed(1) + '%';
  el.mat.textContent = Math.floor(G.mat);
}

let weaponSig = '';
let weaponCdEls = [];
function renderWeapons() {
  const p = G.player;
  if (!p) return;
  const sig = p.weapons.map(w => w.id + w.lv).join(',');
  if (sig === weaponSig) return;
  weaponSig = sig;
  weaponBar.innerHTML = p.weapons.map(w => {
    const def = WEAPONS[w.id];
    return `<div class="wchip on${w.lv}">
      <em>${def.icon}</em>
      <span>${def.name.slice(0, 4)}</span>
      <i>Lv${w.lv}</i>
      <u></u>
    </div>`;
  }).join('');
  weaponCdEls = Array.prototype.slice.call(weaponBar.querySelectorAll('.wchip u'));
}

// 每帧刷新每把武器的装填进度条
function updateWeaponCds() {
  const p = G.player;
  if (!p || !weaponCdEls.length) return;
  for (let i = 0; i < weaponCdEls.length && i < p.weapons.length; i++) {
    const w = p.weapons[i];
    const ready = 1 - clamp(w.cd / (w.cdMax || 0.4), 0, 1);
    weaponCdEls[i].style.width = (ready * 100).toFixed(0) + '%';
  }
}

/* =========================================================
   右侧角色面板 + 悬停详情
   ========================================================= */
const sideEl = document.getElementById('side');
const spStats = document.getElementById('spStats');
const spWeapons = document.getElementById('spWeapons');
const spGear = document.getElementById('spGear');
const spLvEl = document.getElementById('spLv');
const spWCount = document.getElementById('spWCount');
const spGCount = document.getElementById('spGCount');
const tipEl = document.getElementById('wtt');

function num1(v) { return (Math.round(v * 10) / 10).toString(); }
// 尽量显示的整数：接近整数就取整，否则保留 1 位小数
function fmtNum(v) {
  const r = Math.round(v);
  if (Math.abs(v - r) < 0.05) return r.toString();
  return (Math.round(v * 10) / 10).toString();
}

function showSide() { sideEl.classList.add('show'); syncSide(); }
function hideSide() { sideEl.classList.remove('show'); hideTip(); }

function syncSide() {
  const p = G.player;
  if (!p || !sideEl.classList.contains('show')) return;
  hideTip();

  spLvEl.textContent = 'Lv.' + G.level;

  const td = k => p.typeDmg[k] > 0 ? '+' + Math.round(p.typeDmg[k]) : '—';
  const pct = v => (v > 0 ? '+' : '') + Math.round(v * 100) + '%';
  const rows = [
    ['护甲', Math.round(p.armor), p.armor > 0],
    ['减伤', Math.round(armorDR(p.armor) * 100) + '%', p.armor > 0],
    ['移速', Math.round(p.speed), p.speed > 215],
    ['回血', p.regen > 0 ? `${Math.round(regenInterval(p.regen) * 1000)} 毫秒/点` : '—', p.regen > 0],
    ['增伤', pct(p.dmgPct), p.dmgPct > 0],
    ['攻速', pct(p.rateMul - 1), p.rateMul > 1],
    ['近战', td('melee'), p.typeDmg.melee > 0],
    ['远程', td('ranged'), p.typeDmg.ranged > 0],
    ['元素', td('elem'), p.typeDmg.elem > 0],
    ['百分比', td('pct'), p.typeDmg.pct > 0],
    ['暴击率', pct(p.crit), p.crit > 0],
    ['暴伤', pct(p.critMul), p.critMul > 0],
    ['弹道', '+' + p.projBonus, p.projBonus > 0],
    ['穿透', '+' + p.pierceBonus, p.pierceBonus > 0],
    ['弹射', '+' + p.bounce, p.bounce > 0],
    ['爆范围', pct(p.explodeMul - 1), p.explodeMul > 1],
    ['吸血', '+' + Math.round(p.lifesteal), p.lifesteal > 0],
    ['反伤', '+' + Math.round(p.thorns), p.thorns > 0],
    ['拾取', Math.round(p.pickup), false],
    ['刷新量', pct(p.spawnMul - 1), p.spawnMul > 1],
    ['收获', '+' + Math.round(p.harvest), p.harvest > 0],
    ['材料', pct(p.matMul - 1), p.matMul > 1],
  ];
  spStats.innerHTML = `<div class="sp-row full${p.hp / p.maxHp < 0.4 ? ' hi' : ''}"><span>生命</span><b>${Math.ceil(p.hp)} / ${Math.round(p.maxHp)}</b></div>`
    + rows.map(r => `<div class="sp-row${r[2] ? ' hi' : ''}"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('');

  /* --- 武器栏：固定 6 格 --- */
  const sellMode = G.state === 'shop';
  const cells = [];
  for (let i = 0; i < MAX_SLOTS; i++) {
    const w = p.weapons[i];
    if (!w) { cells.push('<div class="slot empty"></div>'); continue; }
    const def = WEAPONS[w.id];
    cells.push(`<div class="slot hoverable on${w.lv}${sellMode ? ' sellable' : ''}" data-w="${i}"><em>${def.icon}</em><u>${w.lv}</u></div>`);
  }
  spWeapons.innerHTML = cells.join('');
  spWCount.textContent = `${p.weapons.length} / ${MAX_SLOTS}`;

  /* --- 道具栏：不限种类数量，超出滚动 --- */
  const owned = Object.keys(p.gear);
  spGear.innerHTML = owned.length ? owned.map(id => {
    const g = GEAR_BY_ID[id];
    if (!g) return '';
    const cnt = p.gear[id];
    return `<div class="slot hoverable on${g.rar}${sellMode ? ' sellable' : ''}" data-g="${id}"><em>${g.icon}</em>${cnt > 1 ? `<span class="cnt">${cnt}</span>` : ''}</div>`;
  }).join('') : '<div class="slot empty"></div>';
  spGCount.textContent = `${owned.length} 种`;
}

function positionTip(node) {
  const r = node.getBoundingClientRect();
  const sr = stageEl.getBoundingClientRect();
  const tw = tipEl.offsetWidth || 170;
  const th = tipEl.offsetHeight || 190;
  let left = r.left - sr.left - tw - 10;
  if (left < 6) left = r.right - sr.left + 10;
  let top = r.top - sr.top + r.height / 2 - th / 2;
  top = clamp(top, 8, sr.height - th - 8);
  left = clamp(left, 6, sr.width - tw - 6);
  tipEl.style.left = left + 'px';
  tipEl.style.top = top + 'px';
}

function showWeaponTip(node, i) {
  const p = G.player;
  const w = p.weapons[i];
  if (!w) return;
  const def = WEAPONS[w.id];
  const s = weaponStats(p, w);
  const avg = s.dmg * (1 + s.crit * (s.critMul - 1));   // 暴击期望伤害
  const dps = avg * s.rate * (s.isMelee ? 1 : s.proj);

  let extra = '';
  if (s.isMelee) {
    extra = `<div class="tt-l"><span>挥砍范围</span><b>${Math.round(s.reach)}</b></div>
      <div class="tt-l"><span>扇角</span><b>${Math.round(s.arc * 180 / Math.PI)}°</b></div>`;
  } else {
    extra = `<div class="tt-l"><span>弹丸</span><b>${s.proj}</b></div>
      <div class="tt-l"><span>穿透</span><b>${s.pierce}</b></div>
      <div class="tt-l"><span>弹速</span><b>${Math.round(s.speed)}</b></div>`;
  }
  if (s.bounce > 0) extra += `<div class="tt-l"><span>弹射</span><b>${s.bounce}</b></div>`;
  if (s.pctAmt > 0) extra += `<div class="tt-l"><span>百分比伤害</span><b>${fmtNum(s.pctAmt * 100)}% 最大生命</b></div>`;

  tipEl.innerHTML = `
    <div class="tt-h" style="color:${rarColor(w.lv)}">${def.icon} ${def.name} Lv.${w.lv}</div>
    <div class="tt-s">${rarName(w.lv)} · ${def.tag} · ${mixText(def.mix)}</div>
    <div class="tt-l"><span>基础伤害</span><b>${Math.round(s.base)}</b></div>
    <div class="tt-l"><span>类型加成</span><b style="color:${mixColor(def.mix)}">+${Math.round(s.typeAdd)}</b></div>
    <div class="tt-l"><span>百分比增伤</span><b>+${Math.round(p.dmgPct * 100)}%</b></div>
    <div class="tt-l"><span>单发伤害</span><b>${Math.round(s.dmg)}</b></div>
    <div class="tt-l"><span>暴击</span><b>${Math.round(s.crit * 100)}% · ${fmtNum(s.critMul)} 倍</b></div>
    <div class="tt-l"><span>射速</span><b>${fmtNum(s.rate)} /秒</b></div>
    <div class="tt-l"><span>理论 DPS</span><b>${Math.round(dps)}</b></div>
    <div class="tt-l"><span>射程</span><b>${Math.round(s.range)}</b></div>
    ${extra}
    <div class="tt-x">${def.desc}</div>`;
  tipEl.classList.add('on');
  positionTip(node);
}

function showGearTip(node, id) {
  const g = GEAR_BY_ID[id];
  if (!g) return;
  const have = G.player.gear[id] || 0;
  tipEl.innerHTML = `
    <div class="tt-h" style="color:${rarColor(g.rar)}">${g.icon} ${g.name}</div>
    <div class="tt-s">${rarName(g.rar)} 道具 · 已拥有 ${have}${g.max ? ' / ' + g.max : ' · 不限量'}</div>
    <div class="tt-x" style="color:#a9bdd6">${g.desc}</div>
    ${G.state === 'shop' ? `<div class="tt-x" style="color:#ffd479">出售可得 ${gearSellValue(g)} 🧩</div>` : ''}`;
  tipEl.classList.add('on');
  positionTip(node);
}

function hideTip() { tipEl.classList.remove('on'); }

/* ---------- 出售 / 合成弹窗 ---------- */
const sellPop = document.getElementById('sellPop');
let sellSel = null;

function closeSellPop() {
  sellPop.classList.remove('on');
  sellSel = null;
  const sel = spWeapons.querySelector('.slot.sel') || spGear.querySelector('.slot.sel');
  if (sel) sel.classList.remove('sel');
}

function positionPop(node) {
  const r = node.getBoundingClientRect();
  const sr = stageEl.getBoundingClientRect();
  const tw = sellPop.offsetWidth || 160;
  const th = sellPop.offsetHeight || 90;
  let left = r.left - sr.left - tw - 8;
  if (left < 6) left = r.left - sr.left + r.width + 8;
  let top = r.top - sr.top + r.height / 2 - th / 2;
  top = clamp(top, 8, sr.height - th - 8);
  // 弹窗若会盖到商店卡片，就收进右侧面板，并挪到槽位上方，保证槽位始终可见
  const panelLeft = sr.width - (sideEl.offsetWidth || 0);
  if (left < panelLeft + 4) {
    left = panelLeft + 4;
    const above = r.top - sr.top - th - 6;
    top = above > 8 ? above : (r.bottom - sr.top + 6);
    top = clamp(top, 8, sr.height - th - 8);
  }
  left = clamp(left, 6, sr.width - tw - 6);
  sellPop.style.left = left + 'px';
  sellPop.style.top = top + 'px';
}

function openSellPop(node, sel) {
  const p = G.player;
  const prev = spWeapons.querySelector('.slot.sel') || spGear.querySelector('.slot.sel');
  if (prev) prev.classList.remove('sel');
  sellSel = null;
  hideTip();

  let title, sub, price, mergeable = false, mergeLabel = '';
  if (sel.kind === 'weapon') {
    const w = p.weapons[sel.idx];
    if (!w) return;
    sel.wref = w;                       // 绑定对象，后面出售/合成不再依赖下标
    const def = WEAPONS[w.id];
    title = `${def.icon} ${def.name} Lv.${w.lv}`;
    sub = `${rarName(w.lv)} · ${mixText(def.mix)}`;
    price = weaponSellValue(w);
    mergeable = canMerge(p, w.id, w.lv);
    if (mergeable) mergeLabel = `合成 Lv.${w.lv + 1}`;
  } else {
    const g = GEAR_BY_ID[sel.id];
    if (!g) return;
    title = `${g.icon} ${g.name}`;
    sub = `${rarName(g.rar)} · 拥有 ${p.gear[sel.id] || 0}`;
    price = gearSellValue(g);
  }

  sellSel = sel;
  node.classList.add('sel');
  sellPop.innerHTML = `
    <div class="pop-t">${title}</div>
    <div class="pop-s">${sub}</div>
    <div class="pop-row">
      <button class="pop-b" data-act="sell">出售 +${price}🧩</button>
      ${mergeable ? `<button class="pop-b merge" data-act="merge">${mergeLabel}</button>` : ''}
    </div>`;
  sellPop.classList.add('on');
  positionPop(node);
}

sellPop.addEventListener('click', e => {
  const b = e.target.closest('.pop-b');
  if (!b || !sellSel) return;
  const p = G.player;
  const act = b.getAttribute('data-act');

  if (sellSel.kind === 'weapon') {
    const w = sellSel.wref;
    const i = p.weapons.indexOf(w);
    if (!w || i < 0) { closeSellPop(); return; }
    if (act === 'merge') {
      doMerge(w.id, w.lv);
    } else {
      G.mat += weaponSellValue(w);
      p.weapons.splice(i, 1);
      sfx('sell');
      weaponSig = '';
    }
  } else {
    const g = GEAR_BY_ID[sellSel.id];
    if (g && p.gear[sellSel.id]) {
      G.mat += gearSellValue(g);
      p.gear[sellSel.id]--;
      if (p.gear[sellSel.id] <= 0) delete p.gear[sellSel.id];
      recalcStats(p);
      sfx('sell');
    }
  }

  closeSellPop();
  if (G.state === 'shop') renderShop();
  else syncSide();
  renderWeapons();
  updateHUD();
});

spWeapons.addEventListener('mouseover', e => {
  const t = e.target.closest && e.target.closest('[data-w]');
  if (!t) return;
  showWeaponTip(t, +t.getAttribute('data-w'));
});
spWeapons.addEventListener('mouseout', e => {
  if (e.target.closest && e.target.closest('[data-w]')) hideTip();
});
spGear.addEventListener('mouseover', e => {
  const t = e.target.closest && e.target.closest('[data-g]');
  if (!t) return;
  showGearTip(t, t.getAttribute('data-g'));
});
spGear.addEventListener('mouseout', e => {
  if (e.target.closest && e.target.closest('[data-g]')) hideTip();
});

/* 商店里点武器 / 道具 → 出售或合成 */
spWeapons.addEventListener('click', e => {
  const t = e.target.closest('[data-w]');
  if (!t) return;
  const idx = +t.getAttribute('data-w');
  if (G.state !== 'shop') { showWeaponTip(t, idx); return; }
  if (sellSel && sellSel.kind === 'weapon' && sellSel.idx === idx) { closeSellPop(); return; }
  openSellPop(t, { kind: 'weapon', idx });
});
spGear.addEventListener('click', e => {
  const t = e.target.closest('[data-g]');
  if (!t) return;
  const id = t.getAttribute('data-g');
  if (G.state !== 'shop') { showGearTip(t, id); return; }
  if (sellSel && sellSel.kind === 'gear' && sellSel.id === id) { closeSellPop(); return; }
  openSellPop(t, { kind: 'gear', id });
});
document.addEventListener('pointerdown', e => {
  if (!sellPop.classList.contains('on')) return;
  if (sellPop.contains(e.target)) return;
  if (e.target.closest && e.target.closest('[data-w],[data-g]')) return;
  closeSellPop();
});

/* =========================================================
   渲染
   ========================================================= */
function drawBackground() {
  ctx.fillStyle = '#0b0e15';
  ctx.fillRect(0, 0, W, H);

  const g = ctx.createRadialGradient(W / 2, H / 2, 40, W / 2, H / 2, W * 0.62);
  g.addColorStop(0, 'rgba(40,70,120,.28)');
  g.addColorStop(1, 'rgba(8,10,16,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(120,170,230,.055)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x <= W; x += 48) { ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); }
  for (let y = 0; y <= H; y += 48) { ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); }
  ctx.stroke();

  ctx.strokeStyle = 'rgba(90,200,255,.18)';
  ctx.lineWidth = 2;
  ctx.strokeRect(4, 4, W - 8, H - 8);
  ctx.strokeStyle = 'rgba(90,200,255,.06)';
  ctx.lineWidth = 10;
  ctx.strokeRect(9, 9, W - 18, H - 18);
}

function drawGems() {
  for (const g of G.gems) {
    const pulse = 1 + Math.sin(g.life * 8) * 0.12;
    ctx.save();
    ctx.translate(g.x, g.y);
    ctx.rotate(g.life * 2);
    ctx.shadowColor = '#4dffb0';
    ctx.shadowBlur = 12;
    ctx.fillStyle = g.r > 5.5 ? '#8effc9' : '#4dffb0';
    ctx.beginPath();
    ctx.moveTo(0, -g.r * pulse);
    ctx.lineTo(g.r * 0.72 * pulse, 0);
    ctx.lineTo(0, g.r * pulse);
    ctx.lineTo(-g.r * 0.72 * pulse, 0);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  ctx.shadowBlur = 0;
}

function drawPlayer(p) {
  const bob = Math.sin(p.walk) * 1.6;

  // 影子
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath();
  ctx.ellipse(p.x, p.y + p.r * 0.82, p.r * 0.92, p.r * 0.42, 0, 0, TAU);
  ctx.fill();

  ctx.save();
  ctx.translate(p.x, p.y + bob);
  if (p.invuln > 0 && Math.sin(p.invuln * 55) > 0) ctx.globalAlpha = 0.5;

  // 身体
  const bg = ctx.createRadialGradient(-p.r * 0.35, -p.r * 0.45, 2, 0, 0, p.r * 1.35);
  bg.addColorStop(0, '#f7dca6');
  bg.addColorStop(0.6, '#e6bd7c');
  bg.addColorStop(1, '#b98a45');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.ellipse(0, 0, p.r, p.r * 0.94, 0, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = 'rgba(60,36,12,.55)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // 武器：每把都真实挂在身上，各瞄各的目标，同时开火
  const list = p.weapons;
  for (let i = 0; i < list.length; i++) {
    const wp = list[i];
    const wdef = WEAPONS[wp.id];
    const gun = wdef.gun;
    const aimA = wp.aim;
    const off = (i - (list.length - 1) / 2) * (list.length > 3 ? 7 : 9.5);

    ctx.save();
    ctx.translate(Math.cos(aimA + Math.PI / 2) * off, Math.sin(aimA + Math.PI / 2) * off);
    ctx.rotate(aimA);
    const L = p.r * gun.len, Wd = gun.w;

    // 近战：握柄 + 刀刃，挥砍时刀身扫过扇形
    if (wdef.melee) {
      const prog = wp.flash > 0 ? 1 - wp.flash / 0.16 : 1;
      const sweep = (Math.sin(prog * Math.PI) * 0.9 - 0.3) * wdef.melee.arc * 0.5;
      ctx.rotate(sweep);
      ctx.fillStyle = gun.color;
      ctx.fillRect(p.r * 0.1, -Wd * 0.28, L * 0.52, Wd * 0.56);
      ctx.shadowColor = wdef.color;
      ctx.shadowBlur = wp.flash > 0 ? 16 : 6;
      ctx.fillStyle = wp.flash > 0 ? '#ffffff' : gun.tip;
      ctx.beginPath();
      ctx.moveTo(p.r * 0.1 + L * 0.45, -Wd * 0.5);
      ctx.lineTo(p.r * 0.1 + L * 1.3, 0);
      ctx.lineTo(p.r * 0.1 + L * 0.45, Wd * 0.5);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.restore();
      continue;
    }

    // 枪身描边，多把枪叠在一起时更容易分辨
    ctx.fillStyle = 'rgba(18,26,34,.55)';
    ctx.fillRect(p.r * 0.1 - 1, -Wd / 2 - 1, L + 2, Wd + 2);

    if (wdef.tag === '贯穿') {
      ctx.shadowColor = '#c9a3ff';
      ctx.shadowBlur = 10;
    }
    ctx.fillStyle = gun.color;
    ctx.fillRect(p.r * 0.1, -Wd / 2, L, Wd);
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,.18)';
    ctx.fillRect(p.r * 0.1, -Wd / 2, L, Wd * 0.35);
    if (wdef.tag === '散射') {
      // 双管
      ctx.fillStyle = '#3b2a1e';
      ctx.fillRect(p.r * 0.1, -Wd / 2 + 1.5, L * 0.7, 2);
    }
    ctx.fillStyle = gun.tip;
    ctx.fillRect(p.r * 0.1 + L, -Wd * 0.34, 8, Wd * 0.68);

    // 枪口火光
    if (wp.flash > 0) {
      const f = wp.flash / 0.07;
      ctx.fillStyle = `rgba(255,235,160,${(0.85 * f).toFixed(2)})`;
      ctx.beginPath();
      ctx.arc(p.r * 0.1 + L + 12, 0, 6 + 5 * f, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  // 眼睛
  const ex = Math.cos(p.aim) * 3.2, ey = Math.sin(p.aim) * 2.6;
  ctx.fillStyle = '#2b1d0e';
  ctx.beginPath();
  ctx.arc(-4.4 + ex, -2.4 + ey, 2.2, 0, TAU);
  ctx.arc(4.4 + ex, -2.4 + ey, 2.2, 0, TAU);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.75)';
  ctx.beginPath();
  ctx.arc(-4.4 + ex + 0.8, -2.4 + ey - 0.8, 0.8, 0, TAU);
  ctx.arc(4.4 + ex + 0.8, -2.4 + ey - 0.8, 0.8, 0, TAU);
  ctx.fill();

  ctx.restore();

  // 受击闪白
  if (p.hurt > 0) {
    ctx.globalAlpha = p.hurt / 0.28 * 0.75;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(p.x, p.y + bob, p.r + 1, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawTree(e) {
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.beginPath();
  ctx.ellipse(e.x, e.y + e.r * 0.92, e.r * 0.9, e.r * 0.38, 0, 0, TAU);
  ctx.fill();

  ctx.save();
  ctx.translate(e.x, e.y);
  const sway = Math.sin(e.wob * 0.9) * 1.4;

  // 树干
  ctx.fillStyle = '#6b4630';
  ctx.fillRect(-5, -e.r * 0.1, 10, e.r * 0.95);
  ctx.fillStyle = 'rgba(255,255,255,.08)';
  ctx.fillRect(-5, -e.r * 0.1, 3, e.r * 0.95);

  // 树冠
  const g = ctx.createRadialGradient(-e.r * 0.35, -e.r * 0.8, 2, 0, -e.r * 0.4, e.r * 1.25);
  g.addColorStop(0, e.hurt > 0 ? '#ffffff' : '#96e888');
  g.addColorStop(1, e.hurt > 0 ? '#ffd0d0' : '#2f7a45');
  ctx.fillStyle = g;
  const blobs = [[0, -e.r * 0.72, e.r * 0.78], [-e.r * 0.62, -e.r * 0.32, e.r * 0.55], [e.r * 0.62, -e.r * 0.32, e.r * 0.55]];
  for (const [ox, oy, rr] of blobs) {
    ctx.beginPath();
    ctx.arc(ox + sway, oy, rr, 0, TAU);
    ctx.fill();
  }

  // 果子
  ctx.fillStyle = 'rgba(255,110,110,.9)';
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.arc(Math.cos(i * 2.1) * e.r * 0.5 + sway, -e.r * 0.55 + Math.sin(i * 1.7) * e.r * 0.34, 2.9, 0, TAU);
    ctx.fill();
  }
  ctx.restore();

  if (e.hp < e.maxHp) {
    const w = e.r * 2, h = 4;
    const x = e.x - e.r, y = e.y - e.r - 30;
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#7ee0b8';
    ctx.fillRect(x, y, w * clamp(e.hp / e.maxHp, 0, 1), h);
  }
}

/* 近战挥砍的扇形 */
function drawSlashes() {
  for (const s of G.slashes) {
    const k = clamp(s.t / s.max, 0, 1);
    const grow = 1 - k;
    const a0 = s.a - s.arc / 2;
    const a1 = s.a + s.arc / 2;
    const cur = a0 + (a1 - a0) * Math.min(1, grow * 1.7);
    const rr = s.reach * (0.6 + grow * 0.42);

    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.globalAlpha = k * 0.22;
    ctx.fillStyle = s.color;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, rr, a0, cur);
    ctx.closePath();
    ctx.fill();

    ctx.globalAlpha = k * 0.85;
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 2 + 5 * k;
    ctx.beginPath();
    ctx.arc(0, 0, rr, a0, cur);
    ctx.stroke();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* 果子 / 宝箱 */
function drawDrops() {
  for (const d of G.drops) {
    const bob = Math.sin(d.life * 6) * 2;
    ctx.save();
    ctx.translate(d.x, d.y + bob);
    if (d.kind === 'fruit') {
      ctx.shadowColor = '#ff8a8a';
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#ff6b6b';
      ctx.beginPath();
      ctx.arc(0, 0, d.r, 0, TAU);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#7be08a';
      ctx.beginPath();
      ctx.ellipse(0, -d.r * 0.85, d.r * 0.62, d.r * 0.3, -0.5, 0, TAU);
      ctx.fill();
    } else {
      ctx.shadowColor = '#ffd479';
      ctx.shadowBlur = 16;
      ctx.fillStyle = '#a97a3f';
      ctx.fillRect(-d.r, -d.r * 0.72, d.r * 2, d.r * 1.44);
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffd479';
      ctx.fillRect(-d.r, -d.r * 0.2, d.r * 2, d.r * 0.44);
      ctx.fillStyle = '#ffe9a8';
      ctx.fillRect(-2.5, -d.r * 0.72, 5, d.r * 1.44);
    }
    ctx.restore();
  }
  ctx.shadowBlur = 0;
}

function drawEnemy(e) {
  const t = ENEMIES[e.type];
  if (t.boss) { drawBoss(e); return; }
  if (t.neutral) { drawTree(e); return; }
  const bob = Math.sin(e.wob) * (e.type === 'sprinter' ? 2 : 1.2);

  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.beginPath();
  ctx.ellipse(e.x, e.y + e.r * 0.85, e.r * 0.85, e.r * 0.38, 0, 0, TAU);
  ctx.fill();

  ctx.save();
  ctx.translate(e.x, e.y + bob);

  const base = e.hurt > 0 ? '#ffffff' : t.color;
  if (!t.light) t.light = lighten(t.color);
  const g = ctx.createRadialGradient(-e.r * 0.3, -e.r * 0.35, 1, 0, 0, e.r * 1.3);
  g.addColorStop(0, e.hurt > 0 ? '#ffffff' : t.light);
  g.addColorStop(1, base);

  ctx.fillStyle = g;
  ctx.strokeStyle = t.dark;
  ctx.lineWidth = 2;

  ctx.beginPath();
  if (t.shape === 'tri') {
    ctx.moveTo(0, -e.r * 1.15);
    ctx.lineTo(e.r, e.r * 0.85);
    ctx.lineTo(-e.r, e.r * 0.85);
    ctx.closePath();
  } else if (t.shape === 'diamond') {
    ctx.moveTo(0, -e.r);
    ctx.lineTo(e.r, 0);
    ctx.lineTo(0, e.r);
    ctx.lineTo(-e.r, 0);
    ctx.closePath();
  } else if (t.shape === 'square') {
    const s2 = e.r * 0.9;
    ctx.rect(-s2, -s2, s2 * 2, s2 * 2);
  } else if (t.shape === 'hexagon') {
    for (let i = 0; i < 6; i++) {
      const a = -Math.PI / 2 + i * TAU / 6;
      const px = Math.cos(a) * e.r, py = Math.sin(a) * e.r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
  } else {
    ctx.arc(0, 0, e.r, 0, TAU);
  }
  ctx.fill();
  ctx.stroke();

  // 护盾环
  if (e.shieldHp > 0) {
    const sa = 0.4 + 0.28 * Math.sin(e.wob * 4);
    ctx.strokeStyle = `rgba(150,225,255,${sa.toFixed(2)})`;
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.arc(0, 0, e.r + 5.5, 0, TAU);
    ctx.stroke();
  }

  // 中毒光晕
  if (e.poisonT > 0) {
    ctx.strokeStyle = 'rgba(158,240,122,.55)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, e.r + 2, 0, TAU);
    ctx.stroke();
  }

  // 减速（冰霜）
  if (e.slowT > 0) {
    ctx.strokeStyle = 'rgba(143,224,255,.6)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(0, 0, e.r + 3.4, 0, TAU);
    ctx.stroke();
  }

  const ex = Math.cos(e.ang) * e.r * 0.2, ey = Math.sin(e.ang) * e.r * 0.2;
  ctx.fillStyle = 'rgba(20,12,20,.85)';
  ctx.beginPath();
  ctx.arc(-e.r * 0.3 + ex, -e.r * 0.18 + ey, e.r * 0.16, 0, TAU);
  ctx.arc(e.r * 0.3 + ex, -e.r * 0.18 + ey, e.r * 0.16, 0, TAU);
  ctx.fill();

  ctx.restore();

  if (e.hp < e.maxHp) {
    const w = e.r * 2, h = 3.4;
    const x = e.x - e.r, y = e.y - e.r - 9;
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = e.hp / e.maxHp > 0.5 ? '#7ee0b8' : e.hp / e.maxHp > 0.25 ? '#ffd479' : '#ff6b7d';
    ctx.fillRect(x, y, w * clamp(e.hp / e.maxHp, 0, 1), h);
  }
}

function drawBoss(e) {
  const bob = Math.sin(e.wob * 0.6) * 3;

  ctx.fillStyle = 'rgba(0,0,0,.4)';
  ctx.beginPath();
  ctx.ellipse(e.x, e.y + e.r * 0.9, e.r * 0.95, e.r * 0.4, 0, 0, TAU);
  ctx.fill();

  // 冲锋预警
  if (e.phase === 'windup') {
    ctx.strokeStyle = `rgba(255,80,80,${0.35 + Math.sin(e.wob * 12) * 0.25})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r + 12 + Math.sin(e.wob * 10) * 4, 0, TAU);
    ctx.stroke();
  }

  ctx.save();
  ctx.translate(e.x, e.y + bob);

  // 尖刺环
  ctx.save();
  ctx.rotate(e.wob * 0.8);
  ctx.fillStyle = e.color;
  ctx.globalAlpha = 0.55;
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * TAU;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * e.r * 0.95, Math.sin(a) * e.r * 0.95);
    ctx.lineTo(Math.cos(a + 0.16) * e.r * 1.32, Math.sin(a + 0.16) * e.r * 1.32);
    ctx.lineTo(Math.cos(a + 0.32) * e.r * 0.95, Math.sin(a + 0.32) * e.r * 0.95);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;

  // 身体
  const g = ctx.createRadialGradient(-e.r * 0.3, -e.r * 0.35, 2, 0, 0, e.r * 1.3);
  g.addColorStop(0, e.hurt > 0 ? '#ffffff' : lighten(e.color));
  g.addColorStop(0.55, e.hurt > 0 ? '#ffdddd' : e.color);
  g.addColorStop(1, '#4a0d16');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(0, 0, e.r, e.r * 0.96, 0, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = 'rgba(30,0,8,.7)';
  ctx.lineWidth = 3;
  ctx.stroke();

  // 眼睛（凶）
  const ex = Math.cos(e.ang) * e.r * 0.12, ey = Math.sin(e.ang) * e.r * 0.12;
  ctx.fillStyle = '#1a0508';
  for (const s of [-1, 1]) {
    ctx.save();
    ctx.translate(s * e.r * 0.34 + ex, -e.r * 0.16 + ey);
    ctx.rotate(s * 0.42);
    ctx.beginPath();
    ctx.ellipse(0, 0, e.r * 0.2, e.r * 0.11, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#ff4d4d';
    ctx.beginPath();
    ctx.arc(0, 0, e.r * 0.055, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#1a0508';
    ctx.restore();
  }

  // 嘴
  ctx.strokeStyle = '#2a0608';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(0, e.r * 0.28, e.r * 0.42, 0.15 * Math.PI, 0.85 * Math.PI);
  ctx.stroke();

  ctx.restore();
}

function drawBossBar() {
  const b = G.boss;
  if (!b || b.hp <= 0) return;
  const bw = 520, bx = (W - bw) / 2, by = 88;
  const pct = clamp(b.hp / b.maxHp, 0, 1);

  ctx.textAlign = 'center';
  ctx.font = '900 15px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = '#ffd0d0';
  ctx.fillText('☠ ' + b.name, W / 2, by - 13);

  ctx.fillStyle = 'rgba(0,0,0,.6)';
  ctx.fillRect(bx, by, bw, 12);
  const g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  g.addColorStop(0, '#ff3d5e');
  g.addColorStop(1, '#ffab5c');
  ctx.fillStyle = g;
  ctx.fillRect(bx + 1.5, by + 1.5, (bw - 3) * pct, 9);
  ctx.strokeStyle = 'rgba(255,120,120,.45)';
  ctx.lineWidth = 1;
  ctx.strokeRect(bx + 0.5, by + 0.5, bw, 12);

  ctx.font = '700 11px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = 'rgba(255,210,210,.75)';
  ctx.fillText(`${Math.ceil(b.hp)} / ${Math.round(b.maxHp)}`, W / 2, by + 30);

  ctx.textAlign = 'left';
}

function lighten(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, ((n >> 16) & 255) + 55);
  const g = Math.min(255, ((n >> 8) & 255) + 55);
  const b = Math.min(255, (n & 255) + 55);
  return `rgb(${r},${g},${b})`;
}

function drawZaps() {
  if (!G.zaps.length) return;
  ctx.save();
  for (const z of G.zaps) {
    const a = clamp(z.t / 0.2, 0, 1);
    const col = z.color || '#9fe8ff';
    if (z.ring) {
      // 爆炸 / 反伤 / 自爆的冲击环
      const grow = 1 - a;
      ctx.strokeStyle = col;
      ctx.globalAlpha = a * 0.9;
      ctx.lineWidth = 2 + a * 3;
      ctx.beginPath();
      ctx.arc(z.x1, z.y1, (z.r || 60) * (0.45 + grow * 0.7), 0, TAU);
      ctx.stroke();
    } else {
      // 链电电弧
      const dx = z.x2 - z.x1, dy = z.y2 - z.y1;
      const nx = -dy, ny = dx;
      const L = Math.hypot(dx, dy) || 1;
      ctx.globalAlpha = a;
      ctx.strokeStyle = col;
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(z.x1, z.y1);
      const seg = 3;
      for (let i = 1; i < seg; i++) {
        const f = i / seg;
        const off = Math.sin(i * 12.9 + z.t * 90) * 9;
        ctx.lineTo(z.x1 + dx * f + (nx / L) * off, z.y1 + dy * f + (ny / L) * off);
      }
      ctx.lineTo(z.x2, z.y2);
      ctx.stroke();
      ctx.fillStyle = col;
      ctx.globalAlpha = a * 0.9;
      ctx.beginPath();
      ctx.arc(z.x2, z.y2, 3.5, 0, TAU);
      ctx.fill();
    }
  }
  ctx.restore();
}

function drawBullets() {
  for (const b of G.bullets) {
    // 拖尾
    ctx.strokeStyle = b.color;
    ctx.globalAlpha = 0.35;
    ctx.lineWidth = b.r * 1.1;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - b.vx * 0.022, b.y - b.vy * 0.022);
    ctx.stroke();
    ctx.globalAlpha = 1;

    ctx.save();
    ctx.shadowColor = b.crit ? '#ffd479' : b.color;
    ctx.shadowBlur = 10;
    ctx.fillStyle = b.crit ? '#ffe9a8' : b.color;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
  ctx.shadowBlur = 0;

  for (const b of G.ebullets) {
    ctx.save();
    ctx.shadowColor = '#ff5f7a';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#ff9aa8';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
  ctx.shadowBlur = 0;
}

function drawParticles() {
  for (const q of G.particles) {
    const a = clamp(q.life / q.max, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = q.color;
    ctx.beginPath();
    ctx.arc(q.x, q.y, q.r * a, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawTexts() {
  for (const t of G.texts) {
    const a = clamp(t.life / t.max, 0, 1);
    ctx.globalAlpha = a;
    ctx.font = `900 ${t.crit ? 18 : 14}px "Microsoft YaHei", sans-serif`;
    ctx.textAlign = 'center';
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(0,0,0,.6)';
    ctx.strokeText(t.text, t.x, t.y);
    ctx.fillStyle = t.heal ? '#8ef07a' : t.coin ? '#ffd479' : t.crit ? '#ffd479' : '#ffffff';
    ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

function drawBanner() {
  if (!G.banner) return;
  const b = G.banner;
  const a = clamp(b.t * 2.2, 0, 1);
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '900 46px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = 'rgba(0,0,0,.55)';
  ctx.fillText(b.text, W / 2 + 2, H * 0.28 + 2);
  ctx.fillStyle = b.text.indexOf('BOSS') >= 0 || b.sub === 'BOSS 战 开始' ? '#ff8b8b' : '#ffe9a8';
  ctx.fillText(b.text, W / 2, H * 0.28);
  if (b.sub) {
    ctx.font = '600 20px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = '#9dc4e8';
    ctx.fillText(b.sub, W / 2, H * 0.28 + 34);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

function render() {
  ctx.save();
  if (G.shake > 0.2) {
    ctx.translate(rand(-G.shake, G.shake) * 0.5, rand(-G.shake, G.shake) * 0.5);
  }

  drawBackground();

  if (G.player) {
    drawGems();
    drawDrops();
    for (const e of G.enemies) drawEnemy(e);
    drawBullets();
    drawZaps();
    if (G.state !== 'dead') drawPlayer(G.player);
    drawSlashes();
    drawParticles();
    drawTexts();

    if (G.player.hurt > 0 && G.state === 'playing') {
      const a = clamp(G.player.hurt / 0.28, 0, 1);
      const vg = ctx.createRadialGradient(W / 2, H / 2, W * 0.2, W / 2, H / 2, W * 0.62);
      vg.addColorStop(0, 'rgba(255,40,60,0)');
      vg.addColorStop(1, `rgba(255,40,60,${(0.5 * a).toFixed(3)})`);
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
    }
  } else {
    drawMenuDecor();
  }

  ctx.restore();

  drawBossBar();
  drawBanner();
}

let decorT = 0;
function drawMenuDecor() {
  decorT += 0.016;
  ctx.globalAlpha = 0.5;
  for (let i = 0; i < 26; i++) {
    const x = (i * 137.5 + decorT * 18 * (i % 3 + 1)) % W;
    const y = (i * 91.3 + Math.sin(decorT + i) * 24) % H;
    ctx.fillStyle = i % 3 === 0 ? 'rgba(126,224,184,.35)' : 'rgba(120,170,230,.22)';
    ctx.beginPath();
    ctx.arc(x, y, 2 + (i % 4), 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* =========================================================
   主循环
   ========================================================= */
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 1 / 20) dt = 1 / 20;
  update(dt);
  render();
  updateWeaponCds();
  requestAnimationFrame(frame);
}

/* =========================================================
   菜单
   ========================================================= */
function showMenu() {
  G.state = 'menu';
  const hint = IS_TOUCH
    ? '按住屏幕<b>左半边</b>拖动移动 · 松开停手<br>所有武器自动瞄准、同时开火'
    : '<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动 · 所有武器自动瞄准、同时开火<br>最多 6 把武器（可以重复），近战/远程/元素/百分比混着来';
  const tipLine = IS_TOUCH
    ? '打怪掉材料 → 波次间进商店 · 波次结束才能选属性强化<br>砍树大概率掉果子，小概率掉宝箱'
    : '打怪掉材料 → 波次间进商店买武器和道具 · 每 5 波 BOSS 战<br>波次结束才能选属性强化 · 右侧面板可出售 / 合成武器<br>砍树大概率掉果子，小概率掉宝箱 · 按 P 暂停 · 按 M 静音';
  panel.innerHTML = `
    <div class="title">土豆兄弟 Mini</div>
    <div class="subtitle">${hint}</div>
    <button class="btn" id="startBtn">开始游戏</button>
    <div class="tip">${tipLine}</div>`;
  overlay.classList.remove('with-side');
  hideSide();
  overlay.classList.add('show');
  hud.classList.remove('show');
  weaponBar.innerHTML = '';
  weaponCdEls = [];
  weaponSig = '';
  document.getElementById('startBtn').onclick = startGame;
}

showMenu();
requestAnimationFrame(frame);

// 调试出口（无副作用，方便自动化测试）
window.__api = {
  G, update, render, startGame, startWave, weaponStats, WEAPONS, WEAPON_KEYS, GEAR, GEAR_BY_ID,
  UPGRADES, shopPool, rollShop, buyItem, doMerge, canMerge, weaponSellValue, gearSellValue,
  openLevelUp, openShop, syncSide, showSide, hideSide, spawnEnemy, spawnTree, initEnemy, killEnemy,
  hurtEnemy, mixAdd, mixText, weaponCardFrom, newWeapon, armorDR,
  rollLvCards, pickUpgrade, renderLevelUp, lvRerollCost, shopRerollCost,
  lvRarOf, RAR_SCALE, lvPool, regenInterval, regenRate,
  openChest, nextStep, rollChestGear, renderChest, updatePickups, gearAvailable,
  showWeaponTip, showGearTip,
  renderWeapons, renderShop, showPause, syncSide, recalcStats, baseStats, gearCard,
  endWave, sameWeapons, G_ready: true,
};

})();
</script>
